<script>
'use strict';
const FIREBASE_CONFIG=null;

/* helpers */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{v=parseFloat(v);return isFinite(v)?v:0};
const fmt=n=>'रु '+(Math.round(num(n)*100)/100).toLocaleString('en-IN');
const p2=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
let OFFSET=0;const now=()=>Date.now()+OFFSET;
const today=()=>ds(new Date(now()));
const dOf=ts=>ds(new Date(ts));
const tf=ts=>{const d=new Date(ts);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const hash=s=>{s='pasal#'+s;let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const opts=(arr,sel)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${String(sel)===String(v)?'selected':''}>${esc(l)}</option>`).join('');
const tbl=(h,r,empty)=>r.length?`<div class="tw"><table><thead><tr>${h.map(x=>x.endsWith('|r')?`<th class="r">${x.slice(0,-2)}</th>`:`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.join('')}</tbody></table></div>`:`<p class="mut">${empty||'कुनै रेकर्ड छैन'}</p>`;
function toast(m,k){const e=document.createElement('div');e.className='toast '+(k||'');e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),4200)}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();a.close()},180)}catch(e){}}
function dl(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
const csv=rows=>'\ufeff'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
function printHTML(html,css){const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);const d=f.contentWindow.document;d.open();d.write('<!doctype html><html><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+html+'</body></html>');d.close();setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),3000)},350)}

/* constants */
const COLS=['users','customers','suppliers','items','purchases','jobs','sales','expenses','closings','templates','activity','settings','links','chat','designs'];
const ST={pending:['बाँकी','b-red'],working:['गर्दैछ','b-amber'],done:['सम्पन्न','b-green'],delivered:['बुझाइयो','b-blue']};
const TY={service:['सेवा','S','🛠️'],print:['प्रिन्ट','P','🖨️'],form:['फाराम','F','🌐'],doc:['निवेदन','D','📝'],trans:['अनुवाद','T','🔤'],pos:['POS','B','🧾']};
const PERS=[['today','आज'],['week','७ दिन'],['month','यो महिना'],['all','सबै']];
const PAYM=[['cash','नगद'],['online','अनलाइन/QR'],['credit','उधारो']];
const DEF={id:'main',shop:'मेरो पसल',addr:'नगरपालिका अगाडि',phone:'',pan:'',foot:'धन्यवाद, फेरि पधारौं!',
 rates:[{n:'B/W प्रिन्ट A4',r:5},{n:'रंगीन प्रिन्ट A4',r:20},{n:'फोटोकपी A4',r:2},{n:'फोटोकपी A3',r:5},{n:'स्क्यान',r:10},{n:'लेमिनेसन A4',r:30}],
 svcTypes:['टाइपिङ','स्क्यान / PDF','लेमिनेसन','बाइन्डिङ','पासपोर्ट साइज फोटो','इमेल / अन्य'],
 formTypes:['राहदानी (Passport)','राष्ट्रिय परिचयपत्र','सवारी लाइसेन्स','PAN / कर','लोकसेवा आवेदन','विद्यालय/क्याम्पस भर्ना','नागरिकता/जन्मदर्ता','अन्य अनलाइन फाराम'],
 expCats:['पसल भाडा','बिजुली / इन्टरनेट','कागज / मसी खरिद','स्टेशनरी खरिद','तलब','चियापान','अन्य'],
 itemCats:['कापी / किताब','कलम / पेन्सिल','प्रिन्ट पेपर','फाइल / फोल्डर','अन्य']};

/* default templates */

let DB={},PRES={},cloud=false,fbdb=null,ONLINE=false,ME=null;
COLS.forEach(c=>DB[c]={});
const LS='shopmgr_db_v4';
const clean=o=>JSON.parse(JSON.stringify(o));
const list=c=>Object.values(DB[c]||{});
const S=()=>Object.assign({},DEF,DB.settings.main||{});
const clone=o=>JSON.parse(JSON.stringify(o));
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d)COLS.forEach(c=>DB[c]=d[c]||{})}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){toast('स्टोरेज भरियो','err')}}
function fberr(e){console.error(e);toast('सिंक त्रुटि: '+(e&&e.message||e),'err')}
function put(col,o){if(!o.id)o.id=uid();DB[col][o.id]=o;saveLocal();if(cloud)fbdb.ref('shop/'+col+'/'+o.id).set(clean(o)).catch(fberr);schedule();return o}
function del(col,id){delete DB[col][id];saveLocal();if(cloud)fbdb.ref('shop/'+col+'/'+id).remove().catch(fberr);schedule()}
function getCfg(){if(sessionStorage.getItem('shopmgr_nocloud'))return null;if(FIREBASE_CONFIG)return FIREBASE_CONFIG;try{return JSON.parse(localStorage.getItem('shopmgr_fbcfg')||'null')}catch(e){return null}}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script load: '+src));document.head.appendChild(s)})}
async function initCloud(cfg){
  const b='https://www.gstatic.com/firebasejs/10.12.2/';
  await loadScript(b+'firebase-app-compat.js');await loadScript(b+'firebase-auth-compat.js');await loadScript(b+'firebase-database-compat.js');
  firebase.initializeApp(cfg);
  try{await firebase.auth().signInAnonymously()}catch(e){console.warn('anon auth',e)}
  fbdb=firebase.database();cloud=true;
  fbdb.ref('.info/serverTimeOffset').on('value',s=>{OFFSET=s.val()||0});
  fbdb.ref('.info/connected').on('value',s=>{ONLINE=!!s.val();renderConn()});
  fbdb.ref('shop/presence').on('value',s=>{PRES=s.val()||{};schedule()});
  await Promise.all(COLS.map(c=>new Promise(res=>{let first=true;fbdb.ref('shop/'+c).on('value',s=>{DB[c]=s.val()||{};saveLocal();if(first){first=false;res()}else schedule()},e=>{fberr(e);if(first){first=false;res()}})})));
  return true;
}
function seed(){
  if(!list('users').length)put('users',{id:'u_admin',name:'एडमिन',username:'admin',pass:hash('admin123'),role:'admin',active:true,createdAt:now()});
  if(!DB.settings.main)put('settings',clone(DEF));
  const sd=S().seeded||[],miss=DEFT.filter(t=>!sd.includes(t.id));
  if(miss.length||!S().seedL){
    miss.forEach(t=>{if(!DB.templates[t.id])put('templates',clone(t))});
    if(!S().seedL)LINKS.forEach(l=>{if(!DB.links[l.id])put('links',clone(l))});
    put('settings',Object.assign({},S(),{id:'main',seeded:[...sd,...miss.map(t=>t.id)],seedL:true}));
  }
}

/* business helpers */
const paidOf=b=>(b.payments||[]).reduce((s,p)=>s+num(p.amt),0);
const allBills=()=>[...list('jobs').map(j=>Object.assign({},j,{_col:'jobs'})),...list('sales').map(s=>Object.assign({},s,{_col:'sales',type:'pos',status:'delivered'}))];
function nextNo(k){const pre={service:'S',print:'P',form:'F',doc:'D',trans:'T',sale:'B',purchase:'PU'}[k];const arr=k==='sale'?list('sales'):k==='purchase'?list('purchases'):list('jobs').filter(j=>j.type===k);let m=0;arr.forEach(x=>{const n=parseInt(String(x.no||'').split('-')[1]);if(n>m)m=n});return pre+'-'+String(m+1).padStart(4,'0')}
function inPer(ts,per){if(per==='all')return true;const d=dOf(ts),t=today();if(per==='today')return d===t;if(per==='week')return ts>=now()-7*864e5;if(per==='month')return d.slice(0,7)===t.slice(0,7);return true}
function jobTitle(j){if(j.type==='trans')return '🔤 '+trDocName(j);if(j.type==='print')return (j.lines||[]).map(l=>l.name+'×'+l.qty).join(', ');if(j.type==='service')return (j.svcType||'')+(j.desc?' – '+j.desc:'');if(j.type==='form')return (j.formType||'')+(j.ref?' ['+j.ref+']':'');return (j.doc&&j.doc.subject)||j.title||''}
function canEdit(r){return ME.role==='admin'||(r.by===ME.id&&dOf(r.createdAt)===today())}
function ensureCust(name,phone){name=(name||'').trim();phone=(phone||'').trim();if(!name)return '';const cs=list('customers');let c=cs.find(x=>phone&&x.phone===phone)||cs.find(x=>x.name.trim().toLowerCase()===name.toLowerCase()&&(!phone||!x.phone));if(!c){c=put('customers',{name,phone,addr:'',note:'',createdAt:now(),by:ME.id,byName:ME.name});log('create','नयाँ ग्राहक: '+name,{col:'customers',id:c.id})}return c.id}
function ensureSupplier(name,phone){name=(name||'').trim();if(!name)return '';const ss=list('suppliers');let s=ss.find(x=>phone&&x.phone===phone)||ss.find(x=>x.name.trim().toLowerCase()===name.toLowerCase());if(!s){s=put('suppliers',{name,phone,addr:'',pan:'',createdAt:now(),by:ME.id});log('create','नयाँ सप्लायर: '+name,{col:'suppliers',id:s.id})}return s.id}
function log(action,text,ref,to){put('activity',{at:now(),by:ME.id,byName:ME.name,role:ME.role,action,text,ref:ref||null,to:to||null});const a=list('activity');if(a.length>900)a.sort((x,y)=>x.at-y.at).slice(0,200).forEach(x=>del('activity',x.id))}
const toOwner=b=>(ME.role==='admin'&&b.by&&b.by!==ME.id)?b.by:null;

/* refresh */
let SCH=0,PEND=false,PAGE='dash';const F={};
const fget=(p,k,d)=>{const o=F[p]||(F[p]={});return o[k]===undefined?d:o[k]};
function setF(p,k,v,full){(F[p]||(F[p]={}))[k]=v;if(full)renderPage();else{const pg=PAGES[p];if(pg.partial)pg.partial();else{const l=$('#lst');if(l&&pg.list)l.innerHTML=pg.list()}}}
function schedule(){clearTimeout(SCH);SCH=setTimeout(refresh,250)}
const typing=root=>{const a=document.activeElement;return a&&root&&root.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)};
function refresh(){
  if(!ME)return;
  const u=DB.users[ME.id];if(!u||u.active===false){toast('खाता बन्द वा हटाइयो','err');logout();return}
  ME=u;
  // staff ले admin-only पेजमा पुगे भने redirect
  if(ME.role!=='admin'&&ADMIN_ONLY.includes(PAGE)){PAGE='dash';renderShell();return}
  const p=PAGES[PAGE];
  if(p){if(p.partial)p.partial();else if(p.list&&$('#lst'))$('#lst').innerHTML=p.list();else if(!typing($('#page')))renderPage();else PEND=true}
  if(MODAL&&MODAL.sync)MODAL.sync();
  if(MODAL&&MODAL.live&&!typing($('#modal'))&&$('#mbody'))$('#mbody').innerHTML=MODAL.bodyFn();
  renderBell();checkNew();
}
document.addEventListener('focusout',()=>{if(PEND){PEND=false;setTimeout(schedule,400)}});
let KNOWN=null,PREV={};
function bellItems(){return list('activity').filter(a=>a.by!==ME.id&&(ME.role==='admin'||a.to===ME.id)).sort((a,b)=>b.at-a.at)}
function checkNew(){
  const acts=list('activity');
  if(KNOWN===null){KNOWN=new Set(acts.map(a=>a.id));PREV={};liveList().forEach(p=>PREV[p.id]=p.doing);return}
  bellItems().forEach(a=>{if(!KNOWN.has(a.id)){toast(a.byName+' '+a.text);beep()}});
  acts.forEach(a=>KNOWN.add(a.id));
  liveList().forEach(p=>{if(p.doing&&PREV[p.id]!==p.doing){toast('🟢 '+p.name+': '+p.doing);beep()}PREV[p.id]=p.doing});
}

/* --- Dashboard — स्टाफलाई आर्थिक कुरा देखिँदैन --- */
function dayStats(date){
  const bills=allBills().filter(b=>dOf(b.createdAt)===date);
  const rec={cash:0,online:0};allBills().forEach(b=>(b.payments||[]).forEach(p=>{if(dOf(p.at)===date)rec[p.method==='online'?'online':'cash']+=num(p.amt)}));
  const purch=list('purchases').filter(p=>p.date===date);
  const ex=list('expenses').filter(e=>e.date===date);
  const byType={};bills.forEach(b=>{byType[b.type]=(byType[b.type]||0)+1});
  return{bills,n:bills.length,billed:bills.reduce((s,b)=>s+num(b.total),0),rec,exCash:ex.filter(e=>e.method!=='online').reduce((s,e)=>s+num(e.amt),0),exAll:ex.reduce((s,e)=>s+num(e.amt),0),credit:bills.reduce((s,b)=>s+Math.max(0,num(b.total)-paidOf(b)),0),byType,purch,purchTotal:purch.reduce((s,p)=>s+num(p.total),0)};
}

list(){const q=fget('suppliers','q','').toLowerCase();const ps=list('purchases');const a=list('suppliers').filter(s=>!q||(s.name+' '+(s.phone||'')).toLowerCase().includes(q)).sort((x,y)=>x.name.localeCompare(y.name));return tbl(['नाम','फोन','ठेगाना','खरिद बिल','कुल खरिद|r','बाँकी|r'],a.map(s=>{const mine=ps.filter(p=>p.supplierId===s.id);const tot=mine.reduce((x,p)=>x+num(p.total),0);const pd=mine.reduce((x,p)=>x+paidOf(p),0);return `<tr class="clk" onclick="supDetail('${s.id}')"><td><b>${esc(s.name)}</b></td><td>${esc(s.phone||'')}</td><td>${esc(s.addr||'')}</td><td>${mine.length}</td><td class="r">${fmt(tot)}</td><td class="r" style="color:${tot-pd>0?'var(--er)':'var(--ok)'}">${fmt(tot-pd)}</td></tr>`}))}};

/* --- Purchase (admin only) --- */
function purchaseForm(id){
  const ed=id?DB.purchases[id]:null;
  const p=ed?clone(ed):{date:today(),lines:[],discount:0,paid:0,method:'cash'};
  let lines=(p.lines&&p.lines.length)?p.lines:[{itemId:'',name:'',qty:1,rate:0}];
  let paidDirty=ed?true:false;
  const body=()=>`<form id="mf" onsubmit="return false">
    <div class="g3">
      <div><label>मिति *</label><input name="date" type="date" value="${esc(p.date)}"></div>
      <div><label>सप्लायर *</label><input name="supplierName" list="supdl" value="${esc(p.supplierName||'')}"><datalist id="supdl">${list('suppliers').map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist></div>
      <div><label>बिल नं.</label><input name="billNo" value="${esc(p.billNo||'')}"></div><div><label>तिर्ने म्याद</label><input name="payDue" type="date" value="${esc(p.payDue||'')}"></div>
    </div>
    <label>सामान</label>
    <div class="tw"><table class="cart"><thead><tr><th>सामान</th><th>परिमाण</th><th>खरिद दर</th><th class="r">रकम</th><th></th></tr></thead><tbody id="plines"></tbody></table></div>
    <div class="row" style="margin-top:6px"><button type="button" class="btn bs" onclick="PF.blank()">+ लाइन</button><button type="button" class="btn bs" onclick="PF.newItemPrompt()">+ नयाँ सामान</button></div>
    <div class="g3" style="margin-top:10px">
      <div><label>छुट</label><input name="discount" type="number" step="any" value="${p.discount||''}" oninput="PF.calc()"></div>
      <div><label>तिरेको</label><input name="paid" type="number" step="any" value="${p.paid||''}" oninput="PF.pd()"></div>
      <div><label>माध्यम</label><select name="method">${opts(PAYM.filter(x=>x[0]!=='credit'),p.method||'cash')}</select></div>
    </div>
    <div class="card" style="background:#f6f8fb;margin-top:10px">उप-जम्मा: <b id="psub">0</b> · <span class="big" id="ptot">0</span> · बाँकी: <b id="pdiff">0</b></div>
    <label><input type="checkbox" name="addStock" style="width:auto" ${ed?'':'checked'}> स्टकमा थप्ने</label>
    <label>कैफियत</label><input name="note" value="${esc(p.note||'')}">
    <div class="foot"><button type="button" class="btn" onclick="closeModal()">रद्द</button><button type="button" class="btn bp" onclick="PF.save()">💾 सेभ</button></div>
  </form>`;
  const PF={
    rows:()=>{const e=$('#plines');if(!e)return;e.innerHTML=lines.map((l,i)=>`<tr>
      <td><input list="itemdl" value="${esc(l.name)}" oninput="PF.ln(${i},'name',this.value)" onchange="PF.match(${i},this.value)"></td>
      <td style="width:80px"><input type="number" step="any" value="${l.qty}" oninput="PF.ln(${i},'qty',this.value)"></td>
      <td style="width:90px"><input type="number" step="any" value="${l.rate}" oninput="PF.ln(${i},'rate',this.value)"></td>
      <td class="r" id="pla${i}">${num(l.qty)*num(l.rate)}</td>
      <td><button type="button" class="btn bs bd" onclick="PF.del(${i})">✕</button></td>
    </tr>`).join('')},
    ln:(i,k,v)=>{lines[i][k]=k==='name'?v:num(v);const a=$('#pla'+i);if(a)a.textContent=num(lines[i].qty)*num(lines[i].rate);PF.calc()},
    match:(i,v)=>{const it=list('items').find(x=>x.name.toLowerCase()===String(v).trim().toLowerCase());if(it){lines[i].itemId=it.id;if(!num(lines[i].rate))lines[i].rate=num(it.cost);PF.rows();PF.calc()}},
    blank:()=>{lines.push({itemId:'',name:'',qty:1,rate:0});PF.rows()},
    del:i=>{lines.splice(i,1);if(!lines.length)lines.push({itemId:'',name:'',qty:1,rate:0});PF.rows();PF.calc()},
    newItemPrompt:()=>{const n=prompt('सामानको नाम?');if(!n)return;const r=num(prompt('खरिद दर?'));const pr=num(prompt('बिक्री दर?'));const it=put('items',{name:n,cat:'',unit:'पिस',cost:r,price:pr,qty:0,low:5,createdAt:now()});lines.push({itemId:it.id,name:it.name,qty:1,rate:r});PF.rows();PF.calc();toast('थपियो','ok')},
    sub:()=>lines.reduce((s,l)=>s+num(l.qty)*num(l.rate),0),
    total:()=>Math.max(0,PF.sub()-num(V('discount'))),
    pd:()=>{paidDirty=true;PF.calc()},
    calc:()=>{const sub=PF.sub(),t=PF.total(),paid=num(V('paid'));const a=$('#psub'),b=$('#ptot'),c=$('#pdiff');if(a)a.textContent=fmt(sub);if(b)b.textContent=fmt(t);if(c)c.textContent=fmt(t-paid);if($('#mf [name="paid"]')&&!paidDirty)$('#mf [name="paid"]').value=t||''},
    save:()=>{
      const supName=V('supplierName').trim();if(!supName){toast('सप्लायर','err');return}
      lines=lines.filter(l=>String(l.name).trim()||num(l.rate));
      if(!lines.length){toast('कम्तीमा एउटा सामान','err');return}
      const addStock=$('#mf [name="addStock"]').checked;
      const o=ed?Object.assign({},ed):{payments:[],createdAt:now(),by:ME.id,byName:ME.name,no:nextNo('purchase')};
      o.date=V('date')||today();o.supplierName=supName;o.supplierId=ensureSupplier(supName,'');o.billNo=V('billNo').trim();o.payDue=V('payDue');
      o.lines=clone(lines);o.discount=num(V('discount'));o.total=PF.total();o.method=V('method');o.note=V('note');
      if(ed&&ed._stockApplied)ed.lines.forEach(l=>{if(l.itemId&&DB.items[l.itemId]){const it=DB.items[l.itemId];put('items',Object.assign({},it,{qty:num(it.qty)-num(l.qty)}))}});
      if(addStock){o.lines.forEach(l=>{let it=l.itemId?DB.items[l.itemId]:null;if(!it)it=list('items').find(x=>x.name.toLowerCase()===String(l.name).trim().toLowerCase());if(it){put('items',Object.assign({},it,{qty:num(it.qty)+num(l.qty),cost:num(l.rate)||it.cost}))}else{const ni=put('items',{name:l.name,cat:'',unit:'पिस',cost:num(l.rate),price:0,qty:num(l.qty),low:5,createdAt:now()});l.itemId=ni.id}});o._stockApplied=true}
      if(!ed){const paid=num(V('paid'));if(paid>0)o.payments.push({amt:paid,method:V('method'),at:now(),by:ME.id,byName:ME.name})}
      put('purchases',o);
      if(!ed){const paid=num(V('paid'));if(paid>0)put('expenses',{date:o.date,cat:'स्टेशनरी खरिद',amt:paid,method:o.method,note:'खरिद बिल '+o.no+' — '+o.supplierName,by:ME.id,byName:ME.name,at:now(),ref:{col:'purchases',id:o.id}})}
      log(ed?'update':'create',`${o.no} खरिद ${ed?'सच्यायो':'दर्ता'} – ${supName} (${fmt(o.total)})`,{col:'purchases',id:o.id});
      closeModal();toast('सेभ: '+o.no,'ok');
      if(!ed&&confirm('खरिद बिल प्रिन्ट गर्ने?'))printPurchase(o.id);
    }
  };
  window.PF=PF;
  openModal(ed?'खरिद सच्याउने: '+ed.no:'नयाँ खरिद बिल',body,{sticky:true,wide:true,doing:'खरिद बिल बनाउँदै'});
  $('#mbody').insertAdjacentHTML('afterbegin','<datalist id="itemdl">'+list('items').map(i=>`<option value="${esc(i.name)}">`).join('')+'</datalist>');
  PF.rows();PF.calc();
}
function printPurchase(id){
  const b=DB.purchases[id];if(!b)return;const s=S();const paid=paidOf(b);
  const rows=b.lines.map(l=>`<tr><td>${esc(l.name)}</td><td class="r">${l.qty}×${l.rate}</td><td class="r">${num(l.qty)*num(l.rate)}</td></tr>`).join('');
  printHTML(`<h3>${esc(s.shop)}</h3><p>${esc(s.addr)} · ${esc(s.phone)}</p><hr><p style="text-align:left">खरिद बिल: ${esc(b.no)}<br>सप्लायर बिल: ${esc(b.billNo||'-')}<br>मिति: ${esc(b.date)}<br>सप्लायर: ${esc(b.supplierName||'-')}</p><hr><table>${rows}</table><hr><table><tr><td>उप-जम्मा</td><td class="r">${num(b.total)+num(b.discount)}</td></tr><tr><td>छुट</td><td class="r">${num(b.discount)}</td></tr><tr><td><b>कुल</b></td><td class="r"><b>${num(b.total)}</b></td></tr><tr><td>तिरेको</td><td class="r">${paid}</td></tr><tr><td>बाँकी</td><td class="r">${Math.max(0,num(b.total)-paid)}</td></tr></table>`,"body{font-family:'Mukta','Noto Sans Devanagari',sans-serif;width:76mm;margin:0 auto;font-size:12px}table{width:100%;border-collapse:collapse}td{padding:1px 0;vertical-align:top}.r{text-align:right}hr{border:0;border-top:1px dashed #000}h3,p{margin:3px 0;text-align:center}@page{margin:4mm}");
}
PAGES.purchase={title:'खरिद (Purchase Entry)',html(){return `<div class="row"><button class="btn bp" onclick="purchaseForm()">＋ नयाँ खरिद बिल</button><input class="grow" placeholder="बिल नं. / सप्लायर" value="${esc(fget('purchase','q',''))}" oninput="setF('purchase','q',this.value)"><select onchange="setF('purchase','per',this.value)">${opts(PERS,fget('purchase','per','month'))}</select></div><div id="lst"></div>`},
list(){const q=fget('purchase','q','').toLowerCase(),per=fget('purchase','per','month');const a=list('purchases').filter(p=>inPer(Date.parse(p.date+'T12:00:00'),per)&&(!q||(p.no+' '+(p.supplierName||'')+' '+(p.billNo||'')).toLowerCase().includes(q))).sort((x,y)=>y.date.localeCompare(x.date));const tot=a.reduce((s,p)=>s+num(p.total),0);const paid=a.reduce((s,p)=>s+paidOf(p),0);return `<p class="mut">${a.length} बिल · कुल ${fmt(tot)} · तिरेको ${fmt(paid)} · बाँकी ${fmt(tot-paid)}</p>`+tbl(['नं.','मिति','सप्लायर','बिल नं.','कुल|r','तिरेको|r','बाँकी|r',''],a.map(p=>`<tr class="clk" onclick="detail('purchases','${p.id}')"><td>${esc(p.no)}</td><td>${esc(p.date)}</td><td>${esc(p.supplierName)}</td><td>${esc(p.billNo||'-')}</td><td class="r">${fmt(p.total)}</td><td class="r">${fmt(paidOf(p))}</td><td class="r" style="color:${num(p.total)-paidOf(p)>0?'var(--er)':'var(--ok)'}">${fmt(num(p.total)-paidOf(p))}</td><td style="white-space:nowrap"><button class="btn bs" onclick="event.stopPropagation();purchaseForm('${p.id}')">✏️</button> <button class="btn bs bd" onclick="event.stopPropagation();delPurchase('${p.id}')">🗑️</button></td></tr>`),'खरिद बिल छैन')}};
function delPurchase(id){const p=DB.purchases[id];if(!p||!confirm(p.no+' मेटाउने? स्टक फिर्ता हुनेछ।'))return;if(p._stockApplied)p.lines.forEach(l=>{if(l.itemId&&DB.items[l.itemId]){const it=DB.items[l.itemId];put('items',Object.assign({},it,{qty:num(it.qty)-num(l.qty)}))}});del('purchases',id);log('delete','खरिद बिल मेटायो: '+p.no);closeModal()}

PAGES.salesReg={title:'बिक्री रजिस्टर',html(){return `<div class="row"><input class="grow" placeholder="बिल / ग्राहक" value="${esc(fget('salesReg','q',''))}" oninput="setF('salesReg','q',this.value)"><select onchange="setF('salesReg','per',this.value)">${opts(PERS,fget('salesReg','per','month'))}</select><select onchange="setF('salesReg','paid',this.value)"><option value="">सबै</option><option value="1" ${fget('salesReg','paid','')==='1'?'selected':''}>बाँकी</option></select></div><div id="lst"></div>`},
list(){const q=fget('salesReg','q','').toLowerCase(),per=fget('salesReg','per','month'),onlyPaid=fget('salesReg','paid','')==='1';let a=allBills().filter(b=>inPer(b.createdAt,per)&&(!q||(b.no+' '+(b.customerName||'')).toLowerCase().includes(q)));if(onlyPaid)a=a.filter(b=>num(b.total)-paidOf(b)>0);a.sort((x,y)=>y.createdAt-x.createdAt);const tot=a.reduce((s,b)=>s+num(b.total),0),pd=a.reduce((s,b)=>s+paidOf(b),0);return `<p class="mut">${a.length} बिल · कुल ${fmt(tot)} · प्राप्त ${fmt(pd)} · बाँकी ${fmt(tot-pd)}</p>`+tbl(['नं.','प्रकार','मिति','ग्राहक','कुल|r','प्राप्त|r','बाँकी|r',''],a.map(b=>`<tr class="clk" onclick="detail('${b._col}','${b.id}')"><td>${esc(b.no)} ${payBadge(b)}</td><td>${TY[b.type||'pos'][2]} ${TY[b.type||'pos'][0]}</td><td>${tf(b.createdAt)}</td><td>${esc(b.customerName||'-')}</td><td class="r">${fmt(b.total)}</td><td class="r">${fmt(paidOf(b))}</td><td class="r" style="color:${num(b.total)-paidOf(b)>0?'var(--er)':'var(--ok)'}">${fmt(num(b.total)-paidOf(b))}</td><td><button class="btn bs" onclick="event.stopPropagation();printReceipt('${b._col}','${b.id}')">🖨️</button></td></tr>`))}};

/* --- Profit (admin) --- */
PAGES.profit={title:'नाफा रिपोर्ट',html(){const per=fget('profit','per','month');return `<div class="row"><select onchange="setF('profit','per',this.value,true)">${opts(PERS,per)}</select></div>${profitBody(per)}`}};
function profitBody(per){
  const bills=allBills().filter(b=>inPer(b.createdAt,per));
  const purch=list('purchases').filter(p=>inPer(Date.parse(p.date+'T12:00:00'),per));
  const ex=list('expenses').filter(e=>{const t=Date.parse(e.date+'T12:00:00');return inPer(t,per)&&!e.ref});
  const sales=bills.reduce((s,b)=>s+num(b.total),0);
  const cogs=bills.filter(b=>b.type==='pos').reduce((s,b)=>s+(b.lines||[]).reduce((q,l)=>q+num(l.cost)*num(l.qty),0),0);
  const exT=ex.reduce((s,e)=>s+num(e.amt),0);
  const gp=sales-cogs,net=gp-exT;
  const itemMap={};
  bills.filter(b=>b.type==='pos').forEach(b=>(b.lines||[]).forEach(l=>{const k=l.itemId||l.name;(itemMap[k]=itemMap[k]||{name:l.name,qty:0,sales:0,cost:0});itemMap[k].qty+=num(l.qty);itemMap[k].sales+=num(l.qty)*num(l.rate);itemMap[k].cost+=num(l.qty)*num(l.cost||0)}));
  return `<div class="stats">
    <div class="stat"><span>कुल बिक्री</span><b>${fmt(sales)}</b></div>
    <div class="stat"><span>COGS</span><b>${fmt(cogs)}</b></div>
    <div class="stat"><span>Gross Profit</span><b style="color:${gp>=0?'var(--ok)':'var(--er)'}">${fmt(gp)}</b></div>
    <div class="stat"><span>सञ्चालन खर्च</span><b>${fmt(exT)}</b></div>
    <div class="stat"><span>Net Profit</span><b style="color:${net>=0?'var(--ok)':'var(--er)'}">${fmt(net)}</b></div>
    <div class="stat"><span>खरिद</span><b>${fmt(purch.reduce((s,p)=>s+num(p.total),0))}</b></div>
  </div>
  <div class="g2"><div class="card"><h3>सामान अनुसार</h3>${tbl(['सामान','परि.|r','बिक्री|r','लागत|r','नाफा|r'],Object.values(itemMap).sort((a,b)=>(b.sales-b.cost)-(a.sales-a.cost)).map(x=>`<tr><td>${esc(x.name)}</td><td class="r">${x.qty}</td><td class="r">${fmt(x.sales)}</td><td class="r">${fmt(x.cost)}</td><td class="r" style="color:${x.sales-x.cost>=0?'var(--ok)':'var(--er)'}">${fmt(x.sales-x.cost)}</td></tr>`),'बिक्री छैन')}</div>
  <div class="card"><h3>बिल प्रकार</h3>${(()=>{const m={};bills.forEach(b=>{const k=b.type;(m[k]=m[k]||{n:0,t:0}).n++;m[k].t+=num(b.total)});return tbl(['प्रकार','बिल|r','रकम|r'],Object.keys(m).map(k=>`<tr><td>${TY[k][2]} ${TY[k][0]}</td><td class="r">${m[k].n}</td><td class="r">${fmt(m[k].t)}</td></tr>`))})()}</div></div>`;
}

/* --- Customers --- */
function custForm(id){
  const c=id?DB.customers[id]:{};
  openModal(id?'ग्राहक सच्याउने':'नयाँ ग्राहक',()=>`<form id="mf" onsubmit="return false"><label>नाम *</label><input name="name" value="${esc(c.name||'')}"><label>फोन</label><input name="phone" value="${esc(c.phone||'')}"><label>ठेगाना</label><input name="addr" value="${esc(c.addr||'')}"><label>कैफियत</label><textarea name="note">${esc(c.note||'')}</textarea><div class="foot"><button type="button" class="btn" onclick="closeModal()">रद्द</button><button type="button" class="btn bp" onclick="saveCust('${id||''}')">सेभ</button></div></form>`,{sticky:true,doing:'ग्राहक दर्ता गर्दै'});
}
function saveCust(id){const n=V('name').trim();if(!n){toast('नाम','err');return}const c=id?DB.customers[id]:{createdAt:now(),by:ME.id,byName:ME.name};const o=put('customers',Object.assign({},c,{name:n,phone:V('phone').trim(),addr:V('addr').trim(),note:V('note')}));log(id?'update':'create',(id?'ग्राहक सच्यायो: ':'नयाँ ग्राहक: ')+n,{col:'customers',id:o.id});closeModal();toast('सेभ','ok')}
function custDetail(id){openModal('ग्राहक विवरण',()=>{const c=DB.customers[id];if(!c)return '<p class="mut">भेटिएन</p>';const bs=allBills().filter(b=>b.customerId===id||(b.customerName===c.name&&(!c.phone||b.phone===c.phone))).sort((a,b)=>b.createdAt-a.createdAt);const adm=ME.role==='admin';const due=bs.reduce((s,b)=>s+Math.max(0,num(b.total)-paidOf(b)),0);return `<p><b>${esc(c.name)}</b><br>📞 ${esc(c.phone||'-')} · 📍 ${esc(c.addr||'-')}<br>${nl(c.note)}</p>${adm?`<p>कुल बिल: <b>${bs.length}</b> · बाँकी: <b>${fmt(due)}</b></p>`:''}${tbl(['नं.','मिति','विवरण',...(adm?['कुल|r','बाँकी|r']:[])],bs.map(b=>`<tr class="clk" onclick="detail('${b._col}','${b.id}')"><td>${b.no}</td><td>${tf(b.createdAt)}</td><td>${esc(b.type==='pos'?(b.lines||[]).map(l=>l.name).join(', '):jobTitle(b))}</td>${adm?`<td class="r">${fmt(b.total)}</td><td class="r">${fmt(Math.max(0,num(b.total)-paidOf(b)))}</td>`:''}</tr>`))}<div class="foot"><button class="btn" onclick="closeModal();custForm('${id}')">सच्याउने</button>${adm?`<button class="btn bd" onclick="delCust('${id}')">मेटाउने</button>`:''}</div>`},{live:true,wide:true})}
function delCust(id){if(!confirm('मेटाउने?'))return;const n=DB.customers[id].name;del('customers',id);log('delete','ग्राहक मेटायो: '+n);closeModal()}
PAGES.customers={title:'ग्राहकहरू',html(){return `<div class="row"><button class="btn bp" onclick="custForm()">＋ नयाँ ग्राहक</button><input class="grow" placeholder="नाम / फोन" value="${esc(fget('customers','q',''))}" oninput="setF('customers','q',this.value)"></div><div id="lst"></div>`},
list(){const q=fget('customers','q','').toLowerCase();const bills=allBills();const adm=ME.role==='admin';const a=list('customers').filter(c=>!q||(c.name+' '+(c.phone||'')).toLowerCase().includes(q)).sort((x,y)=>x.name.localeCompare(y.name));return tbl(['नाम','फोन','ठेगाना',...(adm?['बिल','बाँकी|r']:['']),],a.map(c=>{const bs=bills.filter(b=>b.customerId===c.id);const du=bs.reduce((s,b)=>s+Math.max(0,num(b.total)-paidOf(b)),0);return `<tr class="clk" onclick="custDetail('${c.id}')"><td>${esc(c.name)}</td><td>${esc(c.phone||'')}</td><td>${esc(c.addr||'')}</td>${adm?`<td>${bs.length}</td><td class="r">${du?fmt(du):'-'}</td>`:'<td></td>'}</tr>`}))}};

/* --- Jobs (service/print/form/doc) --- */
['service','print','form','doc'].forEach(t=>{
  PAGES[t]={title:{service:'नयाँ सेवा',print:'प्रिन्ट / फोटोकपी',form:'अनलाइन फाराम',doc:'निवेदन / पत्र'}[t],
  html(){return `<div class="row"><button class="btn bp" onclick="jobForm('${t}')">＋ नयाँ ${TY[t][0]}</button><input class="grow" placeholder="खोज्नुस्" value="${esc(fget(t,'q',''))}" oninput="setF('${t}','q',this.value)"><select onchange="setF('${t}','st',this.value)"><option value="">सबै</option>${opts(Object.keys(ST).map(k=>[k,ST[k][0]]),fget(t,'st',''))}</select><select onchange="setF('${t}','per',this.value)">${opts(PERS,fget(t,'per',t==='print'?'today':'all'))}</select></div><div id="lst"></div>`},
  list(){const q=fget(t,'q','').toLowerCase(),st=fget(t,'st',''),per=fget(t,'per',t==='print'?'today':'all');const adm=ME.role==='admin';
    const a=list('jobs').filter(j=>j.type===t&&(!st||j.status===st)&&inPer(j.createdAt,per)&&(!q||(j.no+' '+j.customerName+' '+(j.phone||'')+' '+jobTitle(j)).toLowerCase().includes(q))).sort((x,y)=>y.createdAt-x.createdAt);
    const tot=a.reduce((s,j)=>s+num(j.total),0),du=a.reduce((s,j)=>s+Math.max(0,num(j.total)-paidOf(j)),0);
    const head=['नं.','मिति','ग्राहक','विवरण','स्थिति','स्टाफ',...(adm?['कुल|r','बाँकी|r']:[''])];
    return (adm?`<p class="mut">${a.length} वटा · कुल ${fmt(tot)} · बाँकी ${fmt(du)}</p>`:`<p class="mut">${a.length} वटा</p>`)+tbl(head,a.map(j=>{const d=Math.max(0,num(j.total)-paidOf(j));return `<tr class="clk" onclick="detail('jobs','${j.id}')"><td>${esc(j.no)}</td><td>${tf(j.createdAt)}</td><td>${esc(j.customerName)}</td><td>${esc(jobTitle(j))}</td><td><span class="badge ${ST[j.status]?ST[j.status][1]:''}">${ST[j.status]?ST[j.status][0]:''}</span></td><td>${esc(j.byName||'')}</td>${adm?`<td class="r">${fmt(j.total)}</td><td class="r">${d?fmt(d):'-'}</td>`:'<td></td>'}</tr>`}))}};
});

function jobForm(type,id){
  const ed=id?DB.jobs[id]:null;
  if(ed&&!canEdit(ed)){toast('सच्याउने अनुमति छैन','err');return}
  const s=S(),j=ed?clone(ed):{};
  let lines=(j.lines&&j.lines.length)?j.lines:(type==='print'?[{name:'',qty:1,rate:0}]:[]);
  let paidDirty=false;
  FM={vals:j.vals||{}};
  const label={service:'सेवा अर्डर',print:'प्रिन्ट बिल',form:'अनलाइन फाराम',doc:'निवेदन/पत्र'}[type];
  let extra='';
  if(type==='print')extra=`<label>छिटो थप्नुस्</label><div class="chips">${s.rates.map((r,i)=>`<span class="chip" onclick="FM.add(${i})">${esc(r.n)} · ${r.r}</span>`).join('')}</div><div class="tw"><table class="cart"><thead><tr><th>विवरण</th><th>परि.</th><th>दर</th><th class="r">रकम</th><th></th></tr></thead><tbody id="lines"></tbody></table></div><button type="button" class="btn bs" onclick="FM.blank()">+ लाइन</button>`;
  if(type==='service')extra=`<div class="g2"><div><label>सेवाको प्रकार</label><input name="svcType" list="svl" value="${esc(j.svcType||'')}"><datalist id="svl">${s.svcTypes.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div><label>शुल्क</label><input name="charge" type="number" step="any" value="${j.charge==null?'':j.charge}" oninput="FM.calc()"></div></div><label>विवरण</label><textarea name="desc">${esc(j.desc||'')}</textarea>`;
  if(type==='form')extra=`<div class="g2"><div><label>फाराम प्रकार</label><input name="formType" list="fml" value="${esc(j.formType||'')}"><datalist id="fml">${s.formTypes.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div><label>आवेदक</label><input name="applicant" value="${esc(j.applicant||'')}"></div><div><label>साइट</label><input name="site" value="${esc(j.site||'')}"></div><div><label>दर्ता नं.</label><input name="ref" value="${esc(j.ref||'')}"></div><div><label>सरकारी शुल्क</label><input name="govFee" type="number" step="any" value="${j.govFee==null?'':j.govFee}" oninput="FM.calc()"></div><div><label>सेवा शुल्क</label><input name="svcFee" type="number" step="any" value="${j.svcFee==null?'':j.svcFee}" oninput="FM.calc()"></div></div><label>पोर्टल लिंक</label><div class="chips">${list('links').map(l=>`<a class="chip" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener" onclick="setSite('${esc(l.id)}')" style="text-decoration:none">${esc(l.title)}</a>`).join('')}</div><label>टिप्पणी</label><textarea name="desc">${esc(j.desc||'')}</textarea>`;
  if(type==='doc'){const d=j.doc||{};extra=`<div class="g2"><div><label>ढाँचा</label><select name="tpl" onchange="FM.tpl(this.value)"><option value="">— खाली —</option>${opts(list('templates').map(t=>[t.id,t.name]),j.tplId||'')}</select></div><div><label>मिति (वि.सं.)</label><input name="dateBS" value="${esc(d.date||localStorage.getItem('shopmgr_bs')||'')}"></div></div><div id="ph" class="g2"></div><label>प्रति</label><textarea name="dto">${esc(d.to||'')}</textarea><label>विषय</label><input name="dsub" value="${esc(d.subject||'')}"><label>मुख्य पाठ</label><textarea name="dbody" style="min-height:150px">${esc(d.body||'')}</textarea><label>हस्ताक्षर</label><textarea name="dsign">${esc(d.sign||'')}</textarea><label>शुल्क</label><input name="fee" type="number" step="any" value="${j.fee==null?'':j.fee}" oninput="FM.calc()">`}
  const body=()=>`<form id="mf" onsubmit="return false"><datalist id="cdl">${list('customers').map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
  <div class="g2"><div><label>ग्राहक *</label><input name="cname" list="cdl" value="${esc(j.customerName||'')}" oninput="FM.cpick()"></div><div><label>फोन</label><input name="phone" value="${esc(j.phone||'')}"></div></div>
  ${extra}
  <div class="g2"><div><label>छुट</label><input name="discount" type="number" step="any" value="${j.discount||''}" oninput="FM.calc()"></div><div><label>Deadline</label><input name="due" type="date" value="${esc(j.due||'')}"></div><div><label>उधारो भुक्तानी म्याद</label><input name="payDue" type="date" value="${esc(j.payDue||'')}"></div></div>
  <div class="card" style="background:#f6f8fb;margin-top:10px">उप-जम्मा: <b id="fsub">0</b> · <span class="big" id="ftot">0</span></div>
  ${ed?`<p class="mut">भुक्तानी: ${fmt(paidOf(ed))}</p>`:`<div class="g2"><div><label>अहिले प्राप्त</label><input name="paid" type="number" step="any" oninput="FM.pd()"></div><div><label>माध्यम</label><select name="method" onchange="FM.pm(this.value)">${opts(PAYM,'cash')}</select></div></div>`}
  <div class="g2"><div><label>स्थिति</label><select name="status">${opts(Object.keys(ST).map(k=>[k,ST[k][0]]),j.status||(type==='print'?'delivered':'pending'))}</select></div><div><label>कैफियत</label><input name="note" value="${esc(j.note||'')}"></div></div>
  <div class="foot"><button type="button" class="btn" onclick="closeModal()">रद्द</button><button type="button" class="btn bp" onclick="FM.save()">💾 सेभ</button></div></form>`;
  FM.rows=()=>{const e=$('#lines');if(!e)return;e.innerHTML=lines.map((l,i)=>`<tr><td><input value="${esc(l.name)}" oninput="FM.ln(${i},'name',this.value)"></td><td style="width:66px"><input type="number" step="any" value="${l.qty}" oninput="FM.ln(${i},'qty',this.value)"></td><td style="width:76px"><input type="number" step="any" value="${l.rate}" oninput="FM.ln(${i},'rate',this.value)"></td><td class="r" id="la${i}">${num(l.qty)*num(l.rate)}</td><td><button type="button" class="btn bs bd" onclick="FM.del(${i})">✕</button></td></tr>`).join('')};
  FM.ln=(i,k,v)=>{lines[i][k]=k==='name'?v:num(v);const a=$('#la'+i);if(a)a.textContent=num(lines[i].qty)*num(lines[i].rate);FM.calc()};
  FM.add=i=>{const r=s.rates[i];const f=lines.find(l=>l.name===r.n&&num(l.rate)===num(r.r));if(f)f.qty=num(f.qty)+1;else{if(lines.length===1&&!lines[0].name&&!num(lines[0].rate))lines=[];lines.push({name:r.n,qty:1,rate:r.r})}FM.rows();FM.calc()};
  FM.blank=()=>{lines.push({name:'',qty:1,rate:0});FM.rows()};
  FM.del=i=>{lines.splice(i,1);FM.rows();FM.calc()};
  FM.sub=()=>type==='print'?lines.reduce((a,l)=>a+num(l.qty)*num(l.rate),0):type==='service'?num(V('charge')):type==='doc'?num(V('fee')):num(V('govFee'))+num(V('svcFee'));
  FM.total=()=>Math.max(0,FM.sub()-num(V('discount')));
  FM.calc=()=>{const sub=FM.sub(),t=FM.total();const a=$('#fsub'),b=$('#ftot');if(a)a.textContent=fmt(sub);if(b)b.textContent=fmt(t);const pe=$('#mf [name="paid"]');if(pe&&!paidDirty)pe.value=t||''};
  FM.pd=()=>{paidDirty=true};FM.pm=m=>{const pe=$('#mf [name="paid"]');if(!pe)return;if(m==='credit'){pe.value='';paidDirty=true}else{paidDirty=false;FM.calc()}};
  FM.cpick=()=>{const n=V('cname').trim().toLowerCase();const c=list('customers').find(x=>x.name.trim().toLowerCase()===n);const pe=$('#mf [name="phone"]');if(c&&pe&&!pe.value)pe.value=c.phone||''};
  FM.fill=(t,v)=>String(t||'').replace(/\{\{\s*([^}]+?)\s*\}\}/g,(m,k)=>(v[k]&&String(v[k]).trim())?v[k]:'………');
  FM.keys=t=>{const set=[];[t.to,t.subject,t.body,t.sign].join('\n').replace(/\{\{\s*([^}]+?)\s*\}\}/g,(m,k)=>{if(k!=='नाम'&&k!=='फोन'&&!set.includes(k))set.push(k);return m});return set};
  FM.gen=()=>{const t=DB.templates[V('tpl')];if(!t)return;const v=Object.assign({'नाम':V('cname'),'फोन':V('phone')},FM.vals);const set=(n,val)=>{const e=$('#mf [name="'+n+'"]');if(e)e.value=val};set('dto',FM.fill(t.to,v));set('dsub',FM.fill(t.subject,v));set('dbody',FM.fill(t.body,v));set('dsign',FM.fill(t.sign,v))};
  FM.tpl=id=>{const t=DB.templates[id];const ph=$('#ph');if(!t){if(ph)ph.innerHTML='';return}ph.innerHTML=FM.keys(t).map(k=>`<div><label>${esc(k)}</label><input value="${esc(FM.vals[k]||'')}" oninput="FM.setv(this.dataset.k,this.value)" data-k="${esc(k)}"></div>`).join('');FM.gen()};
  FM.setv=(k,v)=>{FM.vals[k]=v;FM.gen()};
  FM.save=()=>{
    const cname=V('cname').trim();if(!cname){toast('ग्राहकको नाम','err');return}
    if(type==='print'){lines=lines.filter(l=>l.name.trim()||num(l.rate));if(!lines.length){toast('कम्तीमा एउटा','err');return}}
    const o=ed?Object.assign({},ed):{type,payments:[],comments:[],createdAt:now(),by:ME.id,byName:ME.name};
    o.customerName=cname;o.phone=V('phone').trim();o.customerId=ensureCust(cname,o.phone);
    if(type==='print'){o.lines=clone(lines);o.pages=lines.reduce((a,l)=>a+num(l.qty),0)}
    if(type==='service'){o.svcType=V('svcType');o.charge=num(V('charge'));o.desc=V('desc')}
    if(type==='form'){o.formType=V('formType');o.applicant=V('applicant');o.site=V('site');o.ref=V('ref');o.govFee=num(V('govFee'));o.svcFee=num(V('svcFee'));o.desc=V('desc')}
    if(type==='doc'){o.tplId=V('tpl');o.vals=clone(FM.vals);o.fee=num(V('fee'));o.doc={date:V('dateBS'),to:V('dto'),subject:V('dsub'),body:V('dbody'),sign:V('dsign')};o.title=o.doc.subject;try{localStorage.setItem('shopmgr_bs',V('dateBS'))}catch(e){}}
    o.discount=num(V('discount'));o.total=FM.total();o.status=V('status');o.due=V('due');o.payDue=V('payDue');o.note=V('note');
    if(!ed){o.no=nextNo(type);o.payMethod=V('method');const p=num(V('paid'));if(p>0)o.payments.push({amt:p,method:V('method')==='credit'?'cash':V('method'),at:now(),by:ME.id,byName:ME.name})}
    put('jobs',o);log(ed?'update':'create',`${o.no} ${TY[type][0]} ${ed?'सच्यायो':'बनायो'} – ${cname} (${fmt(o.total)})`,{col:'jobs',id:o.id});
    closeModal();toast('सेभ: '+o.no,'ok');
    if(!ed&&type==='print'){if(confirm('रसिद प्रिन्ट गर्ने?'))printReceipt('jobs',o.id)}
    else if(!ed&&type==='doc')detail('jobs',o.id);
  };
  openModal((ed?'सच्याउने: '+ed.no:'नयाँ '+label),body,{sticky:true,wide:true,doing:(ed?'सच्याउँदै ':'नयाँ ')+label+(ed?' '+ed.no:' बनाउँदै')});
  if(type==='print')FM.rows();
  if(type==='doc'&&j.tplId){const t=DB.templates[j.tplId];if(t){$('#ph').innerHTML=FM.keys(t).map(k=>`<div><label>${esc(k)}</label><input value="${esc(FM.vals[k]||'')}" oninput="FM.setv(this.dataset.k,this.value)" data-k="${esc(k)}"></div>`).join('')}}
  FM.calc();
}

/* --- Bill detail — staff लाई आर्थिक कुरा लुकाउने --- */
function detail(col,id){
  if(ME.role!=='admin'&&(col==='purchases'||col==='sales')){toast('यो रेकर्ड हेर्ने अनुमति छैन','err');return}
  openModal('विवरण',()=>billBody(col,id),{live:true,wide:true})
}
function billBody(col,id){
  const b=DB[col][id];if(!b)return '<p class="mut">भेटिएन</p>';
  const adm=ME.role==='admin';
  if(!adm&&col!=='jobs')return '<p class="mut">अनुमति छैन</p>';
  const paid=paidOf(b),due=num(b.total)-paid;
  let body='';
  if(col==='purchases'){
    if(!adm)return '<p class="mut">अनुमति छैन</p>';
    body=`<p>सप्लायर: <b>${esc(b.supplierName||'-')}</b> · बिल: ${esc(b.billNo||'-')} · मिति: ${esc(b.date)}</p>`+tbl(['सामान','परि.|r','दर|r','रकम|r'],(b.lines||[]).map(l=>`<tr><td>${esc(l.name)}</td><td class="r">${l.qty}</td><td class="r">${l.rate}</td><td class="r">${fmt(num(l.qty)*num(l.rate))}</td></tr>`));
  } else {
    if(b.type==='print')body=tbl(['विवरण','परि.|r','दर|r','रकम|r'],(b.lines||[]).map(l=>`<tr><td>${esc(l.name)}</td><td class="r">${l.qty}</td><td class="r">${l.rate}</td><td class="r">${fmt(num(l.qty)*num(l.rate))}</td></tr>`));
    else if(b.type==='service')body=`<p><b>${esc(b.svcType)}</b><br>${nl(b.desc)}</p>`;
    else if(b.type==='form')body=`<p><b>${esc(b.formType)}</b> — ${esc(b.applicant||b.customerName)}<br>साइट: ${esc(b.site||'-')}<br>दर्ता: <b>${esc(b.ref||'-')}</b>${adm?'<br>सरकारी '+fmt(b.govFee)+' · सेवा '+fmt(b.svcFee):''}</p>`;
    else if(b.type==='doc'){const d=b.doc||{};body=`<p><b>${esc(d.subject)}</b> (${esc(d.date||'-')})</p><div class="card" style="background:#fafafa;white-space:pre-wrap">${esc(d.to)}\n\n${esc(d.body)}\n\n${esc(d.sign)}</div>`}
    if(b.type==='trans')body=`<p><b>${esc(trDocName(b))}</b></p><div class="card" style="background:#fafafa;white-space:pre-wrap">${esc(b.enDoc||b.enText||'')}</div>`;
  }
  const job=col==='jobs';
  const chips=job?`<div class="chips">${Object.keys(ST).map(k=>`<button type="button" class="chip" style="${b.status===k?'background:var(--p);color:#fff':''}" onclick="setStatus('${id}','${k}')">${ST[k][0]}</button>`).join('')}</div>`:'';
  const cms=(b.comments||[]).map(c=>`<div class="it" style="cursor:default"><b>${esc(c.byName)}</b> <span class="mut">${tf(c.at)}</span><br>${nl(c.text)}</div>`).join('');
  const title=col==='purchases'?`खरिद बिल ${b.no}`:`${TY[b.type||'pos'][2]} ${TY[b.type||'pos'][0]} ${b.no}`;

  let moneyBox='';
  if(adm){
    moneyBox=`<div class="card" style="margin-top:10px"><div class="g2"><div>उप-जम्मा: ${fmt(num(b.total)+num(b.discount||0))}<br>छुट: ${fmt(b.discount||0)}<br><b>कुल: ${fmt(b.total)}</b></div><div>प्राप्त: <b style="color:var(--ok)">${fmt(paid)}</b><br>बाँकी: <b style="color:${due>0?'var(--er)':'var(--ok)'}">${fmt(Math.max(0,due))}</b></div></div>
    ${(b.payments||[]).length?tbl(['मिति','रकम|r','माध्यम',''],(b.payments||[]).map((p,i)=>`<tr><td>${tf(p.at)}</td><td class="r">${fmt(p.amt)}</td><td>${p.method==='online'?'अनलाइन':'नगद'}</td><td><button type="button" class="btn bs bd" onclick="delPay('${col}','${id}',${i})">✕</button></td></tr>`)):''}
    <div class="row" style="margin-top:8px"><input id="pamt" type="number" step="any" placeholder="भुक्तानी" style="max-width:140px" value="${due>0?due:''}"><select id="pmeth" style="max-width:140px">${opts(PAYM.filter(x=>x[0]!=='credit'),'cash')}</select><button type="button" class="btn bg" onclick="addPay('${col}','${id}')">＋ भुक्तानी</button></div>${due>0?`<div class="row"><label style="margin:0">उधारो म्याद</label><input id="pdue" type="date" value="${esc(b.payDue||'')}" style="max-width:160px"><button type="button" class="btn bs" onclick="setPayDue('${col}','${id}')">सेभ</button></div>`:''}</div>`;
  }

  const footBtns=[];
  if(adm){
    if(col==='purchases'){footBtns.push(`<button class="btn" onclick="printPurchase('${id}')">🧾 खरिद बिल</button>`);footBtns.push(`<button class="btn" onclick="closeModal();purchaseForm('${id}')">✏️ सच्याउने</button>`)}
    else footBtns.push(`<button class="btn" onclick="printReceipt('${col}','${id}')">🧾 रसिद</button>`);
    if(b.type==='doc')footBtns.push(`<button class="btn" onclick="printDoc('${id}')">🖨️ निवेदन</button>`);
    if(b.type==='trans')footBtns.push(`<button class="btn" onclick="printTrans('${id}')">🖨️ अनुवाद</button>`);
    if(job&&b.type!=='trans'&&canEdit(b))footBtns.push(`<button class="btn" onclick="closeModal();jobForm('${b.type}','${id}')">✏️ सच्याउने</button>`);
    footBtns.push(`<button class="btn bd" onclick="${col==='purchases'?`delPurchase('${id}')`:`delBill('${col}','${id}')`}">🗑️ मेटाउने</button>`);
  } else {
    // स्टाफ: निवेदन प्रिन्ट र स्टेटस मात्र
    if(b.type==='doc')footBtns.push(`<button class="btn" onclick="printDoc('${id}')">🖨️ निवेदन प्रिन्ट</button>`);
    if(b.type==='trans')footBtns.push(`<button class="btn" onclick="printTrans('${id}')">🖨️ अनुवाद प्रिन्ट</button>`);
  }

/* POS — staff ले cost देख्दैन */
let cart=[];const POS={q:'',disc:'',cname:'',phone:'',method:'cash',paid:'',dirty:false,payDue:''};
PAGES.pos={title:'POS बिक्री',html(){return `<div class="pos"><div class="card"><div class="row"><input class="grow" id="posq" placeholder="सामान खोज्नुस्..." value="${esc(POS.q)}" oninput="POS.q=this.value;posList()"><button class="btn" onclick="posCustom()">+ अन्य</button></div><div class="prods" id="poslist"></div></div><div class="card" id="cart"></div></div>`},after(){posList();posCart()},partial(){posList()}};
function posList(){const q=POS.q.toLowerCase();const a=list('items').filter(i=>!q||(i.name+' '+(i.cat||'')).toLowerCase().includes(q)).sort((x,y)=>x.name.localeCompare(y.name));const e=$('#poslist');if(e)e.innerHTML=a.length?a.map(i=>`<div class="prod" onclick="posAdd('${i.id}')"><b>${esc(i.name)}</b><small>${fmt(i.price)} · स्टक ${i.qty}</small></div>`).join(''):'<p class="mut">सामान छैन</p>'}
function posAdd(id){const it=DB.items[id];if(!it)return;const l=cart.find(x=>x.itemId===id);if(l)l.qty=num(l.qty)+1;else cart.push({itemId:id,name:it.name,qty:1,rate:num(it.price),cost:num(it.cost)});posCart();pres({doing:'POS बिल बनाउँदै',draft:'POS: '+cart.map(l=>l.name+'×'+l.qty).join(', ')})}
function posCustom(){const n=prompt('सामानको नाम?');if(!n)return;const r=num(prompt('दर?'));cart.push({itemId:'',name:n,qty:1,rate:r,cost:0});posCart()}
const posSub=()=>cart.reduce((s,l)=>s+num(l.qty)*num(l.rate),0);
function posCart(){const e=$('#cart');if(!e)return;const adm=ME.role==='admin';e.innerHTML=`<h3>🧾 बिल</h3>${cart.length?`<div class="tw"><table class="cart"><thead><tr><th>सामान</th><th>परि.</th><th>दर</th><th class="r">रकम</th><th></th></tr></thead><tbody>${cart.map((l,i)=>`<tr><td>${esc(l.name)}</td><td style="width:70px"><input type="number" min="0" step="any" value="${l.qty}" oninput="cart[${i}].qty=num(this.value);posTot()"></td><td style="width:80px"><input type="number" min="0" step="any" value="${l.rate}" oninput="cart[${i}].rate=num(this.value);posTot()"></td><td class="r" id="pl${i}">${num(l.qty)*num(l.rate)}</td><td><button class="btn bs bd" onclick="cart.splice(${i},1);posCart()">✕</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="mut">सामानमा क्लिक गरेर थप्नुस्</p>'}
<div class="g2"><div><label>ग्राहक</label><input value="${esc(POS.cname)}" oninput="POS.cname=this.value" list="cdl2"><datalist id="cdl2">${list('customers').map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></div><div><label>फोन</label><input value="${esc(POS.phone)}" oninput="POS.phone=this.value"></div><div><label>छुट</label><input type="number" step="any" value="${POS.disc}" oninput="POS.disc=this.value;posTot()"></div><div><label>माध्यम</label><select onchange="POS.method=this.value;POS.dirty=false;posCart()">${opts(PAYM,POS.method)}</select></div><div><label>उधारो म्याद</label><input type="date" value="${esc(POS.payDue)}" oninput="POS.payDue=this.value"></div></div>
${qrBox()}<div class="card" style="background:#f6f8fb;margin-top:10px">उप-जम्मा: <b id="psub">0</b> · कुल: <span class="big" id="ptot">0</span></div>
<label>प्राप्त</label><input id="ppaid" type="number" step="any" value="${POS.paid}" oninput="POS.paid=this.value;POS.dirty=true;posTot()"><p class="mut">बाँकी: <b id="pdue">0</b></p>
<div class="foot"><button class="btn" onclick="cart=[];POS.disc='';POS.paid='';POS.dirty=false;posCart()">खाली</button><button class="btn bg" onclick="posCheckout()">✅ बिल</button></div>`;posTot()}
function posTot(){cart.forEach((l,i)=>{const e=$('#pl'+i);if(e)e.textContent=num(l.qty)*num(l.rate)});const sub=posSub(),tot=Math.max(0,sub-num(POS.disc));const a=$('#psub'),b=$('#ptot'),c=$('#ppaid'),d=$('#pdue');if(a)a.textContent=fmt(sub);if(b)b.textContent=fmt(tot);if(c&&!POS.dirty){const pv=POS.method==='credit'?0:tot;c.value=pv||'';POS.paid=c.value}if(d)d.textContent=fmt(Math.max(0,tot-num(c?c.value:0)));pres({draft:'POS: '+cart.map(l=>l.name+'×'+l.qty).join(', ')+' | कुल '+fmt(tot)})}
function posCheckout(){
  if(!cart.length){toast('सामान छान्नुस्','err');return}
  if(POS.method==='credit'&&!POS.cname.trim()){toast('उधारोका लागि ग्राहकको नाम चाहिन्छ','err');return}
  for(const l of cart){if(l.itemId){const it=DB.items[l.itemId];if(!it||num(it.qty)<num(l.qty)){toast('स्टक पुग्दैन: '+l.name,'err');return}}}
  const sub=posSub(),disc=num(POS.disc),total=Math.max(0,sub-disc),paid=num(POS.paid);
  const s={no:nextNo('sale'),lines:clone(cart),discount:disc,total,customerName:POS.cname.trim(),phone:POS.phone.trim(),payDue:POS.payDue||'',payMethod:POS.method,payments:[],comments:[],createdAt:now(),by:ME.id,byName:ME.name};
  if(s.customerName)s.customerId=ensureCust(s.customerName,s.phone);
  if(paid>0)s.payments.push({amt:paid,method:POS.method==='credit'?'cash':POS.method,at:now(),by:ME.id,byName:ME.name});
  put('sales',s);
  cart.forEach(l=>{if(l.itemId){const it=DB.items[l.itemId];put('items',Object.assign({},it,{qty:num(it.qty)-num(l.qty)}))}});
  log('sale',`POS बिल ${s.no} (${fmt(total)}) — नाफा ${fmt(total-cart.reduce((x,l)=>x+num(l.cost)*num(l.qty),0))}`,{col:'sales',id:s.id});
  cart=[];POS.disc='';POS.paid='';POS.dirty=false;POS.cname='';POS.phone='';POS.payDue='';POS.method='cash';posCart();posList();pres({doing:'',draft:''});toast('बिल: '+s.no,'ok');
  if(ME.role==='admin'&&confirm('रसिद प्रिन्ट?'))printReceipt('sales',s.id);
}

function itemForm(id){const it=id?DB.items[id]:{low:5,qty:0};openModal(id?'सामान सच्याउने':'नयाँ सामान',()=>`<form id="mf" onsubmit="return false"><label>नाम *</label><input name="name" value="${esc(it.name||'')}"><div class="g2"><div><label>वर्ग</label><input name="cat" list="catdl" value="${esc(it.cat||'')}"><datalist id="catdl">${DEF.itemCats.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div><label>एकाइ</label><input name="unit" value="${esc(it.unit||'पिस')}"></div><div><label>खरिद मूल्य</label><input name="cost" type="number" step="any" value="${it.cost==null?'':it.cost}"></div><div><label>बिक्री मूल्य</label><input name="price" type="number" step="any" value="${it.price==null?'':it.price}"></div><div><label>स्टक</label><input name="qty" type="number" step="any" value="${it.qty}"></div><div><label>कम स्टक (≤)</label><input name="low" type="number" step="any" value="${it.low}"></div></div><div class="foot"><button type="button" class="btn" onclick="closeModal()">रद्द</button><button type="button" class="btn bp" onclick="saveItem('${id||''}')">सेभ</button></div></form>`,{sticky:true})}
function saveItem(id){if(ME.role!=='admin'){toast('अनुमति छैन','err');return}const n=V('name').trim();if(!n){toast('नाम','err');return}const it=id?DB.items[id]:{createdAt:now()};put('items',Object.assign({},it,{name:n,cat:V('cat'),unit:V('unit'),cost:num(V('cost')),price:num(V('price')),qty:num(V('qty')),low:num(V('low'))}));log(id?'update':'create','स्टक: '+n);closeModal();toast('सेभ','ok')}
function restock(id){if(ME.role!=='admin'){toast('अनुमति छैन','err');return}const it=DB.items[id];openModal('स्टक थप्ने: '+it.name,()=>`<form id="mf" onsubmit="return false"><p>हाल: <b>${it.qty}</b></p><div class="g2"><div><label>थप्ने</label><input name="add" type="number" step="any"></div><div><label>खरिद मूल्य</label><input name="cost" type="number" step="any" value="${it.cost||''}"></div></div><div class="foot"><button type="button" class="btn" onclick="closeModal()">रद्द</button><button type="button" class="btn bp" onclick="doRestock('${id}')">थप्नुस्</button></div></form>`,{sticky:true})}
function doRestock(id){if(ME.role!=='admin'){toast('अनुमति छैन','err');return}const it=DB.items[id],a=num(V('add')),c=num(V('cost'));if(a<=0){toast('परिमाण','err');return}put('items',Object.assign({},it,{qty:num(it.qty)+a,cost:c||it.cost}));log('update',`स्टक: ${it.name} +${a}`);closeModal();toast('थपियो','ok')}

PAGES.stock={title:'स्टक',html(){return `<div class="row">${ME.role==='admin'?`<button class="btn bp" onclick="itemForm()">＋ नयाँ सामान</button>`:''}<input class="grow" placeholder="खोज्नुस्" value="${esc(fget('stock','q',''))}" oninput="setF('stock','q',this.value)"><select onchange="setF('stock','low',this.value)"><option value="">सबै</option><option value="1" ${fget('stock','low','')==='1'?'selected':''}>कम स्टक</option></select></div><div id="lst"></div>`},
list(){const adm=ME.role==='admin';const q=fget('stock','q','').toLowerCase(),lo=fget('stock','low','');const a=list('items').filter(i=>(!q||(i.name+' '+(i.cat||'')).toLowerCase().includes(q))&&(!lo||num(i.qty)<=num(i.low))).sort((x,y)=>x.name.localeCompare(y.name));

function clCalc(){const o=num($('#cl_open').value),exp=o+CLS.cash-CLS.exCash;$('#cl_exp').textContent=fmt(exp);const c=$('#cl_cnt').value;$('#cl_diff').textContent=c===''?'—':fmt(num(c)-exp)}

/* Accounts (admin) */
function range(){return[fget('accounts','from',today().slice(0,8)+'01'),fget('accounts','to',today())]}
const inR=(ts,R)=>{const d=dOf(ts);return d>=R[0]&&d<=R[1]};
function accPre(k){const t=today();let f=t;if(k==='week')f=ds(new Date(now()-6*864e5));else if(k==='month')f=t.slice(0,8)+'01';else if(k==='all')f='2000-01-01';F.accounts=Object.assign(F.accounts||{},{from:f,to:t});renderPage()}
PAGES.accounts={title:'लेखा / रिपोर्ट',html(){
  if(ME.role!=='admin')return '<p class="mut">यो पेज हेर्ने अनुमति छैन।</p>';
  const R=range(),tab=fget('accounts','tab','sum');
  return `<div class="row"><label style="margin:0">देखि</label><input type="date" value="${R[0]}" onchange="setF('accounts','from',this.value,true)" style="max-width:160px"><label style="margin:0">सम्म</label><input type="date" value="${R[1]}" onchange="setF('accounts','to',this.value,true)" style="max-width:160px"><button class="btn bs" onclick="accPre('today')">आज</button><button class="btn bs" onclick="accPre('week')">७ दिन</button><button class="btn bs" onclick="accPre('month')">महिना</button><button class="btn bs" onclick="accPre('all')">सबै</button></div><div class="tabs">${[['sum','सारांश'],['ledger','खाता'],['purch','खरिद'],['udhar','उधारो'],['exp','खर्च'],['staff','स्टाफ']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="setF('accounts','tab','${k}',true)">${l}</button>`).join('')}</div>${accTab(tab,R)}`}};
function accData(R){const all=allBills(),bills=all.filter(b=>inR(b.createdAt,R)),pays=[];all.forEach(b=>(b.payments||[]).forEach(p=>{if(inR(p.at,R))pays.push(Object.assign({},p,{no:b.no,cust:b.customerName,type:b.type}))}));const exps=list('expenses').filter(e=>e.date>=R[0]&&e.date<=R[1]);const purch=list('purchases').filter(p=>p.date>=R[0]&&p.date<=R[1]);const cogs=bills.filter(b=>b.type==='pos').reduce((s,b)=>s+(b.lines||[]).reduce((q,l)=>q+num(l.cost)*num(l.qty),0),0);return{all,bills,pays,exps,purch,cogs}}
function accTab(tab,R){
  const D=accData(R),billed=D.bills.reduce((s,b)=>s+num(b.total),0),recv=D.pays.reduce((s,p)=>s+num(p.amt),0),expT=D.exps.reduce((s,e)=>s+num(e.amt),0),purchT=D.purch.reduce((s,p)=>s+num(p.total),0);
  if(tab==='sum'){
    const byT={};D.bills.forEach(b=>{const k=b.type;(byT[k]=byT[k]||{n:0,t:0}).n++;byT[k].t+=num(b.total)});
    const byC={};D.exps.forEach(e=>{byC[e.cat]=(byC[e.cat]||0)+num(e.amt)});
    const cashR=D.pays.filter(p=>p.method!=='online').reduce((s,p)=>s+num(p.amt),0);
    const gp=billed-D.cogs,net=gp-D.exps.filter(e=>!e.ref).reduce((s,e)=>s+num(e.amt),0);
    return `<div class="stats"><div class="stat"><span>कुल बिक्री</span><b>${fmt(billed)}</b></div><div class="stat"><span>प्राप्त</span><b>${fmt(recv)}</b><span>नगद ${fmt(cashR)} · अनलाइन ${fmt(recv-cashR)}</span></div><div class="stat"><span>COGS</span><b>${fmt(D.cogs)}</b></div><div class="stat"><span>Gross Profit</span><b>${fmt(gp)}</b></div><div class="stat"><span>सञ्चालन खर्च</span><b>${fmt(expT)}</b></div><div class="stat"><span>Net Profit</span><b>${fmt(net)}</b></div><div class="stat"><span>कुल खरिद</span><b>${fmt(purchT)}</b></div><div class="stat"><span>नगद आधार</span><b>${fmt(recv-expT)}</b></div></div>
    <div class="g2"><div class="card"><h3>सेवा अनुसार</h3>${tbl(['प्रकार','बिल|r','रकम|r'],Object.keys(byT).map(k=>`<tr><td>${TY[k][2]} ${TY[k][0]}</td><td class="r">${byT[k].n}</td><td class="r">${fmt(byT[k].t)}</td></tr>`))}</div><div class="card"><h3>खर्च वर्ग</h3>${tbl(['वर्ग','रकम|r'],Object.keys(byC).map(k=>`<tr><td>${esc(k)}</td><td class="r">${fmt(byC[k])}</td></tr>`))}</div></div>`}
  if(tab==='ledger'){
    const rows=[...D.pays.map(p=>({ts:p.at,k:'आम्दानी',d:p.no+' – '+(p.cust||''),m:p.method,a:num(p.amt)})),...D.exps.map(e=>({ts:Date.parse(e.date+'T12:00:00'),k:'खर्च',d:e.cat+(e.note?' – '+e.note:''),m:e.method,a:-num(e.amt)}))].sort((a,b)=>b.ts-a.ts);
    window.LEDGER=rows;
    return `<div class="row"><button class="btn bs" onclick="exportCSV('ledger')">⬇️ CSV</button><span class="mut">आम्दानी ${fmt(recv)} − खर्च ${fmt(expT)} = <b>${fmt(recv-expT)}</b></span></div>`+tbl(['मिति','प्रकार','विवरण','माध्यम','रकम|r'],rows.map(r=>`<tr><td>${tf(r.ts)}</td><td><span class="badge ${r.a>=0?'b-green':'b-red'}">${r.k}</span></td><td>${esc(r.d)}</td><td>${r.m==='online'?'अनलाइन':'नगद'}</td><td class="r">${fmt(Math.abs(r.a))}</td></tr>`))}
  if(tab==='purch'){
    return `<p class="mut">कुल खरिद: <b>${fmt(purchT)}</b> · तिरेको: <b>${fmt(D.purch.reduce((s,p)=>s+paidOf(p),0))}</b> · बाँकी: <b style="color:var(--er)">${fmt(purchT-D.purch.reduce((s,p)=>s+paidOf(p),0))}</b></p>`+tbl(['नं.','मिति','सप्लायर','बिल नं.','कुल|r','तिरेको|r','बाँकी|r'],D.purch.sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<tr class="clk" onclick="detail('purchases','${p.id}')"><td>${esc(p.no)}</td><td>${esc(p.date)}</td><td>${esc(p.supplierName)}</td><td>${esc(p.billNo||'-')}</td><td class="r">${fmt(p.total)}</td><td class="r">${fmt(paidOf(p))}</td><td class="r">${fmt(num(p.total)-paidOf(p))}</td></tr>`),'खरिद छैन')}
  if(tab==='udhar'){
    const g={};D.all.forEach(b=>{const d=num(b.total)-paidOf(b);if(d>0){const k=b.customerId||b.customerName||'—';(g[k]=g[k]||{name:b.customerName||'अज्ञात',phone:b.phone,id:b.customerId,n:0,d:0}).n++;g[k].d+=d}});
    const a=Object.values(g).sort((x,y)=>y.d-x.d);
    return `<p class="mut">कुल: <b>${fmt(a.reduce((s,x)=>s+x.d,0))}</b></p>`+tbl(['ग्राहक','फोन','बिल','बाँकी|r'],a.map(x=>`<tr class="${x.id?'clk':''}" ${x.id?`onclick="custDetail('${x.id}')"`:''}><td>${esc(x.name)}</td><td>${esc(x.phone||'')}</td><td>${x.n}</td><td class="r">${fmt(x.d)}</td></tr>`),'उधारो छैन')}
  if(tab==='exp')return `<div class="row"><button class="btn bp" onclick="expForm()">＋ नयाँ खर्च</button><span class="mut">कुल: <b>${fmt(expT)}</b></span></div>`+tbl(['मिति','वर्ग','विवरण','माध्यम','स्टाफ','रकम|r',''],D.exps.sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.cat)}</td><td>${esc(e.note||'')}</td><td>${e.method==='online'?'अनलाइन':'नगद'}</td><td>${esc(e.byName||'')}</td><td class="r">${fmt(e.amt)}</td><td><button class="btn bs" onclick="expForm('${e.id}')">✏️</button> <button class="btn bs bd" onclick="delExp('${e.id}')">🗑️</button></td></tr>`));
  if(tab==='staff'){
    const rows=list('users').map(u=>{const mine=D.bills.filter(b=>b.by===u.id);const cnt=k=>mine.filter(b=>b.type===k).length;const pages=mine.filter(b=>b.type==='print').reduce((s,b)=>s+num(b.pages),0);const rc=D.pays.filter(p=>p.by===u.id).reduce((s,p)=>s+num(p.amt),0);const purchCount=list('purchases').filter(p=>p.by===u.id&&inR(Date.parse(p.date+'T12:00:00'),R)).length;return `<tr><td>${esc(u.name)} <span class="mut">(${u.role==='admin'?'एडमिन':'स्टाफ'})</span></td><td>${purchCount}</td><td>${cnt('print')} <span class="mut">(${pages} पाना)</span></td><td>${cnt('service')}</td><td>${cnt('form')}</td><td>${cnt('doc')}</td><td>${cnt('pos')}</td><td class="r">${fmt(mine.reduce((s,b)=>s+num(b.total),0))}</td><td class="r">${fmt(rc)}</td></tr>`});
    return tbl(['स्टाफ','खरिद','प्रिन्ट','सेवा','फाराम','निवेदन','POS','बिल रकम|r','प्राप्त|r'],rows)}
  return '';
}
function exportCSV(k){
  if(ME.role!=='admin'){toast('अनुमति छैन','err');return}
  let rows=[],name=k+'.csv';
  if(k==='ledger'){rows=[['मिति','प्रकार','विवरण','माध्यम','रकम']];(window.LEDGER||[]).forEach(r=>rows.push([tf(r.ts),r.k,r.d,r.m,r.a]))}
  if(k==='bills'){rows=[['बिल नं','प्रकार','मिति','ग्राहक','फोन','विवरण','कुल','छुट','प्राप्त','बाँकी','स्थिति','स्टाफ']];allBills().sort((a,b)=>a.createdAt-b.createdAt).forEach(b=>rows.push([b.no,TY[b.type][0],dOf(b.createdAt),b.customerName,b.phone,b.type==='pos'?(b.lines||[]).map(l=>l.name+'×'+l.qty).join('; '):jobTitle(b),b.total,b.discount||0,paidOf(b),num(b.total)-paidOf(b),ST[b.status]?ST[b.status][0]:'',b.byName]))}
  if(k==='purchases'){rows=[['खरिद नं','मिति','सप्लायर','बिल नं','कुल','तिरेको','बाँकी','स्टाफ']];list('purchases').forEach(p=>rows.push([p.no,p.date,p.supplierName,p.billNo||'',p.total,paidOf(p),num(p.total)-paidOf(p),p.byName||'']))}
  if(k==='sales'){rows=[['बिल नं','मिति','ग्राहक','सामान','कुल','प्राप्त','बाँकी','स्टाफ']];list('sales').forEach(s=>rows.push([s.no,dOf(s.createdAt),s.customerName||'',(s.lines||[]).map(l=>l.name+'×'+l.qty).join('; '),s.total,paidOf(s),num(s.total)-paidOf(s),s.byName||'']))}
  if(k==='suppliers'){rows=[['नाम','फोन','ठेगाना','PAN']];list('suppliers').forEach(s=>rows.push([s.name,s.phone,s.addr,s.pan]))}
  if(k==='expenses'){rows=[['मिति','वर्ग','विवरण','माध्यम','रकम','स्टाफ']];list('expenses').sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>rows.push([e.date,e.cat,e.note,e.method,e.amt,e.byName]))}
  if(k==='customers'){rows=[['नाम','फोन','ठेगाना','कैफियत']];list('customers').forEach(c=>rows.push([c.name,c.phone,c.addr,c.note]))}
  if(k==='stock'){rows=[['सामान','वर्ग','स्टक','एकाइ','खरिद मूल्य','बिक्री मूल्य']];list('items').forEach(i=>rows.push([i.name,i.cat,i.qty,i.unit,i.cost,i.price]))}
  if(k==='stockLedger'){rows=[['मिति','प्रकार','सामान','परिवर्तन','दर','बिल','पक्ष']];const ev=[];list('purchases').forEach(p=>(p.lines||[]).forEach(l=>ev.push({date:p.date,ts:Date.parse(p.date+'T12:00:00'),type:'खरिद',name:l.name,qty:l.qty,rate:l.rate,ref:p.no,party:p.supplierName})));list('sales').forEach(s=>(s.lines||[]).forEach(l=>ev.push({date:dOf(s.createdAt),ts:s.createdAt,type:'बिक्री',name:l.name,qty:-l.qty,rate:l.rate,ref:s.no,party:s.customerName})));ev.sort((a,b)=>a.ts-b.ts).forEach(e=>rows.push([e.date,e.type,e.name,e.qty,e.rate,e.ref,e.party]))}
  dl(name,csv(rows))
}

function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('मर्ज गर्ने?'))return;let n=0;COLS.forEach(c=>Object.values(d[c]||{}).forEach(o=>{if(o&&o.id){put(c,o);n++}}));toast(n+' रेकर्ड','ok')}catch(e){toast('फाइल मिलेन','err')}};r.readAsText(f)}

const GL={};GTXT.split('\n').forEach(l=>{const i=l.indexOf('=');if(i>0)GL[l.slice(0,i)]=l.slice(i+1)});
const GRX=new RegExp('(?<![\\u0900-\\u097F])(?:'+Object.keys(GL).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\u0900-\\u097F])','g');
const CONS={'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'ng','च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'n','ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'ph','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'b','श':'sh','ष':'sh','स':'s','ह':'h'};
const IVW={'अ':'a','आ':'a','इ':'i','ई':'i','उ':'u','ऊ':'u','ऋ':'ri','ए':'e','ऐ':'ai','ओ':'o','औ':'au'};
const MAT={'ा':'a','ि':'i','ी':'i','ु':'u','ू':'u','े':'e','ै':'ai','ो':'o','ौ':'au','ृ':'ri'};
function tl(w){w=w.replace(/[‌‍]/g,'').replace(/ज्ञ/g,'');const ch=[...w];let o='';for(let i=0;i<ch.length;i++){const c=ch[i];if(c===''||CONS[c]!==undefined){o+=c===''?'gy':CONS[c];let n=ch[i+1];if(n==='़'){i++;n=ch[i+1]}if(n==='्'){i++;continue}if(n!==undefined&&MAT[n]!==undefined){o+=MAT[n];i++;continue}if(i>=ch.length-1||ch[i-1]==='्')o+='a';else if(i===ch.length-1)o+='';else o+='a'}else if(IVW[c]!==undefined)o+=IVW[c];else if(c==='ं'||c==='ँ')o+='n';else if(c==='ः')o+='h';else if(c==='्'||c==='़'){}else o+=c}return o.charAt(0).toUpperCase()+o.slice(1)}
function convertNe(t){t=String(t==null?'':t);if(!t.trim())return '';const parts=[];let s=t.replace(GRX,m=>{parts.push(GL[m]);return '\u0002'+(parts.length-1)+'\u0003'});s=s.replace(/[०-९]/g,d=>'०१२३४५६७८९'.indexOf(d)).replace(/[।॥]/g,'.');s=s.replace(/[ऀ-ॿ]+/g,w=>tl(w));s=s.replace(/\u0002(\d+)\u0003/g,(m,i)=>parts[+i]);return s.replace(/[ \t]{2,}/g,' ').replace(/ +([,.;:])/g,'$1').replace(/^ +| +$/gm,'').trim()}

 printHTML(`<h3>${esc(s.shop)}</h3><p>${esc(s.addr)}</p><p>${esc(s.phone)}${s.pan?' · PAN: '+esc(s.pan):''}</p><hr><p style="text-align:left">बिल: ${esc(b.no)}<br>मिति: ${tf(b.createdAt)}<br>ग्राहक: ${esc(b.customerName||'-')}${b.phone?' · '+esc(b.phone):''}</p><hr><table>${rows}</table><hr><table><tr><td>छुट</td><td class="r">${num(b.discount||0)}</td></tr><tr><td><b>कुल</b></td><td class="r"><b>${num(b.total)}</b></td></tr><tr><td>भुक्तानी माध्यम</td><td class="r"><b>${lab}</b></td></tr>${cash>0?`<tr><td>प्राप्त नगद</td><td class="r">${cash}</td></tr>`:''}${onl>0?`<tr><td>प्राप्त अनलाइन/QR</td><td class="r">${onl}</td></tr>`:''}${bal>0?`<tr><td><b>उधारो बाँकी</b></td><td class="r"><b>${bal}</b></td></tr>${b.payDue?`<tr><td>तिर्ने म्याद</td><td class="r">${esc(b.payDue)}</td></tr>`:''}`:'<tr><td>बाँकी</td><td class="r">0</td></tr>'}</table>${bal>0&&s.qr?`<hr><p><img src="${s.qr}" style="width:38mm"><br>QR स्क्यान गरी भुक्तानी गर्नुस्</p>`:''}<hr><p>${esc(s.foot)}</p><p style="font-size:10px">स्टाफ: ${esc(b.byName||'')}</p>`,"body{font-family:'Mukta','Noto Sans Devanagari',sans-serif;width:72mm;margin:0 auto;font-size:12px}table{width:100%;border-collapse:collapse}td{padding:1px 0;vertical-align:top}.r{text-align:right}hr{border:0;border-top:1px dashed #000}h3,p{margin:3px 0;text-align:center}img{max-width:100%}@page{margin:4mm}")};

/* उधारो हिसाब पेज */
const UF={tab:'recv'};let CUR=null;const UC={};
function grp(kind){const m={},src=kind==='recv'?allBills():list('purchases').map(p=>Object.assign({},p,{_col:'purchases'}));
 src.forEach(b=>{const d=num(b.total)-paidOf(b);if(d<=0)return;const nm=kind==='recv'?(b.customerName||'अज्ञात'):(b.supplierName||'अज्ञात'),id=kind==='recv'?b.customerId:b.supplierId,k=id||('n:'+nm),g=m[k]=m[k]||{k,name:nm,phone:b.phone||'',bills:[],bal:0,due:''};g.bills.push(b);g.bal+=d;if(b.payDue&&(!g.due||b.payDue<g.due))g.due=b.payDue;if(!g.phone&&b.phone)g.phone=b.phone});
 return Object.values(m).sort((a,b)=>b.bal-a.bal)}
function uList(){const kind=UF.tab,a=UC[kind]=grp(kind),t=today();return tbl([kind==='recv'?'ग्राहक':'सप्लायर','फोन','बिल','बाँकी|r','नजिकको म्याद'],a.map((g,i)=>`<tr class="clk" onclick="DU.open(${i})"><td><b>${E(g.name)}</b></td><td>${E(g.phone)}</td><td>${g.bills.length}</td><td class="r" style="color:var(--er)"><b>${fmt(g.bal)}</b></td><td>${g.due?E(g.due)+(g.due<t?' <span class="badge b-red">नाघ्यो</span>':''):'-'}</td></tr>`),'कुनै बाँकी छैन ✅')}
PAGES.udhar={title:'उधारो हिसाब',partial(){const l=document.getElementById('ud_list');if(l)l.innerHTML=uList()},html(){if(ME.role!=='admin')return '<p class="mut">अनुमति छैन</p>';const r=grp('recv'),p=grp('pay');return `<div class="stats"><div class="stat"><span>असुल्नुपर्ने (ग्राहकबाट)</span><b style="color:var(--er)">${fmt(r.reduce((s,x)=>s+x.bal,0))}</b><span>${r.length} जना</span></div><div class="stat"><span>तिर्नुपर्ने (सप्लायरलाई)</span><b>${fmt(p.reduce((s,x)=>s+x.bal,0))}</b><span>${p.length} सप्लायर</span></div></div><div class="tabs"><button class="${UF.tab==='recv'?'on':''}" onclick="DU.tab('recv')">ग्राहकको उधारो</button><button class="${UF.tab==='pay'?'on':''}" onclick="DU.tab('pay')">सप्लायरको बाँकी</button></div><div id="ud_list">${uList()}</div>`}};
function ledger(){openModal(CUR.kind==='recv'?'ग्राहक उधारो खाता':'सप्लायर खाता',()=>{const g=grp(CUR.kind).find(x=>x.k===CUR.k);if(!g)return '<p class="mut">कुनै बाँकी छैन ✅</p>';const bs=g.bills.slice().sort((a,b)=>(a.createdAt||Date.parse(a.date+'T12:00:00'))-(b.createdAt||Date.parse(b.date+'T12:00:00')));
 return `<p><b>${E(g.name)}</b> ${g.phone?'· 📞 '+E(g.phone):''}<br>कुल बाँकी: <b style="color:var(--er)">${fmt(g.bal)}</b></p>${tbl(['नं.','मिति','विवरण','कुल|r','तिरेको|r','बाँकी|r','म्याद'],bs.map(b=>`<tr class="clk" onclick="detail('${b._col}','${b.id}')"><td>${E(b.no)}</td><td>${E(b.date||tf(b.createdAt))}</td><td>${E(b.type==='pos'?(b.lines||[]).map(l=>l.name).join(', '):b._col==='purchases'?'खरिद '+(b.billNo||''):jobTitle(b))}</td><td class="r">${fmt(b.total)}</td><td class="r">${fmt(paidOf(b))}</td><td class="r">${fmt(num(b.total)-paidOf(b))}</td><td>${E(b.payDue||'-')}</td></tr>`))}
 <div class="row" style="margin-top:10px"><input id="ud_amt" type="number" step="any" placeholder="रकम" value="${g.bal}" style="max-width:140px"><select id="ud_m" style="max-width:150px">${opts(PAYM.filter(x=>x[0]!=='credit'),'cash')}</select><button class="btn bg" onclick="DU.pay()">＋ ${CUR.kind==='recv'?'भुक्तानी लिने':'भुक्तानी दिने'}</button><button class="btn" onclick="DU.stmt()">🖨️ विवरण</button></div><p class="mut">रकम पुरानो बिलबाट क्रमशः मिलान हुन्छ।</p>`},{live:true,wide:true})}
window.DU={tab:k=>{UF.tab=k;renderPage()},open:i=>{const g=(UC[UF.tab]||[])[i];if(!g)return;CUR={kind:UF.tab,k:g.k};ledger()},
 pay:()=>{const g=grp(CUR.kind).find(x=>x.k===CUR.k);if(!g)return;let amt=num(document.getElementById('ud_amt').value);if(amt<=0){toast('रकम','err');return}const m=document.getElementById('ud_m').value;let left=amt;
  g.bills.slice().sort((a,b)=>(a.createdAt||Date.parse(a.date+'T12:00:00'))-(b.createdAt||Date.parse(b.date+'T12:00:00'))).forEach(b=>{if(left<=0)return;const d=num(b.total)-paidOf(b),t=Math.min(d,left);if(t<=0)return;const o=DB[b._col][b.id];put(b._col,Object.assign({},o,{payments:[...(o.payments||[]),{amt:t,method:m,at:now(),by:ME.id,byName:ME.name}]}));left-=t});
  log('payment',`${g.name} — ${fmt(amt-left)} ${CUR.kind==='recv'?'प्राप्त':'भुक्तानी'}`);toast(fmt(amt-left)+' दर्ता भयो','ok')},
 stmt:()=>{const g=grp(CUR.kind).find(x=>x.k===CUR.k);if(!g)return;const s=S();printHTML(`<h2>${E(s.shop)}</h2><p>${E(s.addr)} ${E(s.phone)}</p><h3>${CUR.kind==='recv'?'उधारो विवरण':'भुक्तानी बाँकी विवरण'}: ${E(g.name)}</h3><p>मिति: ${today()}</p><table><tr><th>नं.</th><th>मिति</th><th>कुल</th><th>तिरेको</th><th>बाँकी</th><th>म्याद</th></tr>${g.bills.map(b=>`<tr><td>${E(b.no)}</td><td>${E(b.date||dOf(b.createdAt))}</td><td>${num(b.total)}</td><td>${paidOf(b)}</td><td>${num(b.total)-paidOf(b)}</td><td>${E(b.payDue||'')}</td></tr>`).join('')}<tr><td colspan="4"><b>कुल बाँकी</b></td><td colspan="2"><b>रु ${g.bal}</b></td></tr></table>${s.qr&&CUR.kind==='recv'?`<p><img src="${s.qr}" style="width:35mm"><br>QR स्क्यान गरी भुक्तानी गर्नुस्</p>`:''}`,"@page{size:A4;margin:18mm}body{font-family:'Mukta','Noto Sans Devanagari',sans-serif;font-size:13px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #888;padding:4px 6px;text-align:left}")}};
})();
