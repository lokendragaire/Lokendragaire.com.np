<!DOCTYPE html>
<html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>गलकोट नगरपालिका – विपद् क्षति ड्यासबोर्ड</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;background:#f3f5f8;color:#1c2733;font-size:14px}
header{background:#14466b;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{font-size:18px;margin:0}main{padding:12px 16px;max-width:1500px;margin:auto}
.card{background:#fff;border-radius:8px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
button,select,input,textarea{font:inherit;padding:6px 10px;border:1px solid #b9c3cf;border-radius:6px;background:#fff}
button{cursor:pointer;background:#14466b;color:#fff;border:0}button.alt{background:#e5ebf1;color:#14466b}
.tabs button{background:#e5ebf1;color:#14466b;margin-right:4px}.tabs button.on{background:#14466b;color:#fff}
.chips label{display:inline-block;margin:2px 4px 2px 0;padding:3px 9px;border:1px solid #b9c3cf;border-radius:14px;cursor:pointer;background:#fff}
.chips input{display:none}.chips label:has(input:checked){background:#14466b;color:#fff;border-color:#14466b}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:#eaf1f8;border-radius:8px;padding:10px}.kpi b{font-size:22px;display:block;color:#14466b}
.tw{overflow:auto;max-height:60vh}table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid #cfd6de;padding:4px 6px;vertical-align:top}th{background:#dfe8f1;position:sticky;top:0}
.bar{display:flex;align-items:center;margin:3px 0}.bar span{width:210px;font-size:13px}.bar i{display:block;height:16px;background:#2f7fbf;border-radius:3px}.bar em{margin-left:6px;font-style:normal;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.grid label{font-size:12px;display:block}.grid input,.grid select,.grid textarea{width:100%}
#login{max-width:340px;margin:12vh auto}#login input{width:100%;margin:5px 0}.hide{display:none}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media print{header,.noprint{display:none!important}body{background:#fff}.tw{max-height:none;overflow:visible}.card{box-shadow:none}}
</style></head><body>

<div id="login" class="card"><h1 style="color:#14466b">गलकोट नगरपालिका</h1><p>विपद् क्षति ड्यासबोर्ड – लगइन</p>
<input id="u" placeholder="आईडी / इमेल"><input id="p" type="password" placeholder="पासवर्ड" onkeydown="if(event.key=='Enter')login()">
<button onclick="login()" style="width:100%">लगइन</button><p id="lerr" style="color:#b00"></p></div>

<div id="app" class="hide">
<header><h1>गलकोट नगरपालिका – विपद् क्षति विवरण</h1><div class="row"><span id="mode"></span><button class="alt" onclick="refresh()">🔄 रिफ्रेश</button><button class="alt" onclick="logout()">लगआउट</button></div></header>
<main>
<div class="card noprint row tabs"><button id="t1" class="on" onclick="tab(1)">ड्यासबोर्ड</button><button id="t2" onclick="tab(2)">फिल्टर / तालिका</button><button id="t3" onclick="tab(3)">नयाँ डाटा प्रविष्टि</button>
<span style="flex:1"></span><label class="alt" style="padding:6px 10px;border-radius:6px;background:#e5ebf1;cursor:pointer">📂 Excel अपलोड<input type="file" accept=".xlsx,.xls" class="hide" onchange="upload(this)"></label></div>

<div class="card noprint"><b>वडा:</b> <span class="chips" id="fw"></span><br><b>क्षतिको किसिम:</b> <span class="chips" id="fc"></span>
<div class="row" style="margin-top:6px"><select id="mode2" onchange="render()"><option value="any">कुनै पनि (OR)</option><option value="all">सबै (AND)</option></select>
<input id="q" placeholder="नाम / स्थान / फोन खोज्नुहोस्" oninput="render()"><button class="alt" onclick="clr()">फिल्टर हटाउने</button></div></div>

<div id="v1"><div class="card"><div class="kpis" id="kpis"></div></div>
<div class="card"><b>क्षतिको किसिम अनुसार प्रभावित विवरण (संख्या)</b><div id="bars"></div></div>
<div class="card"><b>वडागत सारांश</b><div class="tw"><table id="wt"></table></div></div></div>

<div id="v2" class="hide"><div class="card"><div class="row noprint" style="margin-bottom:6px"><b id="cnt2"></b><span style="flex:1"></span>
<button onclick="xl()">⬇ XLSX</button><button onclick="doc()">⬇ Word (DOC)</button><button onclick="pdf()">🖨 PDF / प्रिन्ट</button></div>
<div class="tw"><table id="tb"></table></div></div></div>

<div id="v3" class="hide"><div class="card"><b>नयाँ रेकर्ड थप्ने</b><div class="grid" id="form" style="margin-top:8px"></div>
<div class="row" style="margin-top:8px"><button onclick="addRec()">+ सुरक्षित गर्ने</button><button class="alt" onclick="if(confirm('सबै डाटा (Supabase सहित) हटाउने?')){wipe().then(refresh)}">सबै डाटा खाली</button><span id="fmsg"></span></div></div></div>
</main></div>

<script>
/* ===== Supabase (खाली राख्दा local demo मात्र चल्छ) =====
 SQL: create table damage_records(id uuid default gen_random_uuid() primary key, ward int, data jsonb, created_at timestamptz default now());
 alter table damage_records enable row level security;
 create policy "auth rw" on damage_records for all to authenticated using(true) with check(true); */
const SUPA_URL='https://dqeazvueqvncpbofbrpu.supabase.co', SUPA_KEY='sb_publishable_5VbUjJ1HqZ6jp-agyn6zIw_v3wTyxcU';
const EMAIL_DOMAIN='@galkot.app'; // ID 'Lokendr@' -> email 'lokendr@galkot.app' (Supabase Auth ma yahi user banaunus)
const LOCAL_ID='Lokendr@', LOCAL_PW='Galkot@123';
const sb=(SUPA_URL&&SUPA_KEY&&window.supabase)?supabase.createClient(SUPA_URL,SUPA_KEY):null;

const FD={h_pakki:'घर पक्की',h_kachi:'घर कच्ची',d_full:'घर क्षति पूर्ण',d_most:'घर अधिकांश नष्ट',d_normal:'घर क्षति सामान्य',
ip_full:'सिँचाइ पक्की पूर्ण',ip_part:'सिँचाइ पक्की आंशिक',ik_full:'सिँचाइ कच्ची पूर्ण',ik_part:'सिँचाइ कच्ची आंशिक',
g_full:'गोठ पूर्ण',g_norm:'गोठ सामान्य',death:'मृत्यु',injured:'घाइते',l_bagar:'जग्गा बगर (रोपनी)',l_katan:'जग्गा कटान (रोपनी)',l_other:'जग्गा पाखो/अन्य',
c_dhan:'बाली धान (मुरी)',c_other:'बाली अन्य',cattle:'चौपाया',birds:'पंक्षी',grain:'खाद्यान्न'};
const CATS=[['घरको अवस्था',['h_pakki','h_kachi']],['घरको क्षति',['d_full','d_most','d_normal']],['सिँचाइ क्षति पक्की',['ip_full','ip_part']],
['सिँचाइ क्षति कच्ची',['ik_full','ik_part']],['गोठमा क्षति',['g_full','g_norm']],['मानवीय क्षति',['death','injured']],['जग्गा जमिनको क्षति',['l_bagar','l_katan','l_other']],
['बालीमा क्षति',['c_dhan','c_other']],['चौपायामा क्षति',['cattle']],['पंक्षिमा क्षति',['birds']],['खाद्यान्नमा क्षति',['grain']]];
const BASE=['sn','name','user','hh','place','phone','nature'],TAIL=['demand','remark'];
const LBL={ward:'वडा',sn:'क्र.सं.',name:'घरधनी/जग्गाधनी',user:'भोगकर्ता',hh:'प्रभावित परिवार',place:'स्थान',phone:'मो.नं.',nature:'घरको प्रकृति',demand:'अपेक्षा',remark:'कैफियत',...FD};
const STD=[...BASE,'h_pakki','h_kachi','d_full','d_most','d_normal','ip_full','ip_part','ik_full','ik_part','g_full','g_norm','death','injured','l_bagar','l_katan','l_other','c_dhan','c_other','cattle','birds','grain',...TAIL];
const S6=[...BASE,'h_kachi','d_full','d_most','d_normal','ip_full','ip_part','ik_full','ik_part','l_bagar','l_katan','l_other','c_dhan','c_other','cattle','birds','grain',...TAIL];
const allKeys=CATS.flatMap(c=>c[1]);
let data=JSON.parse(localStorage.getItem('galkot_data')||'[]'),W=new Set(),C=new Set();

const dn=s=>String(s).replace(/[०-९]/g,d=>'०१२३४५६७८९'.indexOf(d));
const cl=v=>{if(v==null)return'';const s=String(v).trim();return/^[-_–—\s]*$/.test(s)?'':s};
const num=v=>{const m=dn(v).match(/\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN};
const has=(r,k)=>r[k]!==undefined&&r[k]!=='';
const save=()=>localStorage.setItem('galkot_data',JSON.stringify(data));

/* ---- login ---- */
async function login(){const u=$('u').value.trim(),p=$('p').value;$('lerr').textContent='';
 if(u!==LOCAL_ID||p!==LOCAL_PW){$('lerr').textContent='आईडी/पासवर्ड मिलेन';return}
 if(!sb){$('lerr').textContent='Supabase library लोड भएन – इन्टरनेट जाँच्नुहोस्';return}
 $('lerr').textContent='Supabase सँग जडान हुँदैछ...';
 const r=await pull();if(r!==true){$('lerr').textContent='Supabase जडान असफल: '+r;return}
 sessionStorage.a='sb';start()}
function logout(){sessionStorage.removeItem('a');sb&&sb.auth.signOut();location.reload()}
async function pull(){try{let all=[],from=0;for(;;){const{data:d,error}=await sb.from('damage_records').select('ward,data').order('created_at').range(from,from+999);if(error)throw error;all.push(...d);if(d.length<1000)break;from+=1000}
 data=all.map(x=>({...x.data,ward:x.ward}));save();window._sbn=all.length;return true}catch(e){console.log(e);const m=e.message||String(e);return /does not exist|schema cache/.test(m)?m+' → पहिले supabase_setup.sql Run गर्नुहोस्':m}}
async function refresh(){const r=await pull();if(r!==true){alert('Supabase बाट ल्याउन सकिएन: '+r);return}buildUI();render();$('mode').textContent='Supabase जडित ('+window._sbn+')'}
async function wipe(){if(!sb)return;try{const{error}=await sb.from('damage_records').delete().gte('ward',0);if(error)throw error}catch(e){console.log(e);alert('Supabase बाट हटाउन सकिएन: '+(e.message||e))}}
async function push(rows){if(!sb||sessionStorage.a!='sb')return;try{for(let i=0;i<rows.length;i+=500){const{error}=await sb.from('damage_records').insert(rows.slice(i,i+500).map(r=>({ward:r.ward,data:r})));if(error)throw error}}catch(e){console.log(e);alert('Supabase मा सेभ भएन: '+(e.message||e))}}
const $=id=>document.getElementById(id);
function start(){$('login').classList.add('hide');$('app').classList.remove('hide');$('mode').textContent='Supabase जडित ('+(window._sbn??0)+')';buildUI();render()}

/* ---- Excel parsing ---- */
function parseSheet(ws,name){const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true}),ward=num(name),out=[];
 if(/क्षतिको विवरण/.test(String(rows[0]&&rows[0][0]))){let last=null;
  for(let i=2;i<rows.length;i++){const r=rows[i];if(!r.some(x=>cl(x)))continue;
   if(cl(r[0])){last={ward,sn:cl(r[0]),place:cl(r[1]),name:cl(r[2]),phone:cl(r[5]),nature:cl(r[6]),remark:[cl(r[7]),cl(r[8])].filter(Boolean).join(' | '),demand:cl(r[9])};out.push(last)}
   else if(last){last.remark+=[' | '+cl(r[7]),cl(r[8])].filter(Boolean).join(' | ');if(cl(r[9]))last.demand+=' | '+cl(r[9])}}
  return out}
 const map=(rows[3]||[]).some(c=>/गोठ/.test(c))?STD:S6;
 for(let i=5;i<rows.length;i++){const r=rows[i];if(/बगर रोपनीमा|कटान रोपनीमा/.test(r.join('')))continue;
  const o={ward};let any=false;map.forEach((k,j)=>{const v=cl(r[j]);if(v){o[k]=v;if(j>0)any=true}});
  if(any){if(!o.name)o.name='(नाम नखुलेको)';out.push(o)}}
 return out}
function upload(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'});let rows=[];wb.SheetNames.forEach(n=>rows.push(...parseSheet(wb.Sheets[n],n)));
  const rep=confirm('पुरानो डाटा हटाएर यो फाइलले बदल्ने? (Cancel = पुरानोमा थप्ने)');
  (async()=>{if(rep&&sessionStorage.a=='sb')await wipe();data=rep?rows:data.concat(rows);save();await push(rows);await refresh();alert(rows.length+' रेकर्ड Supabase मा सेभ भयो')})()};
 rd.readAsArrayBuffer(f);inp.value=''}

/* ---- UI ---- */
function chip(id,val,label,set){return`<label><input type=checkbox ${set.has(val)?'checked':''} onchange="tg('${id}','${val}',this.checked)">${label}</label>`}
function tg(id,v,on){const s=id=='w'?W:C;on?s.add(v):s.delete(v);render()}
function clr(){W.clear();C.clear();$('q').value='';buildUI();render()}
function buildUI(){const ws=[...new Set([...Array(11)].map((_,i)=>i+1).concat(data.map(r=>r.ward).filter(x=>x)))].sort((a,b)=>a-b);
 $('fw').innerHTML=ws.map(w=>chip('w',w,'वडा '+w,W)).join('');$('fc').innerHTML=CATS.map(c=>chip('c',c[0],c[0],C)).join('');
 $('form').innerHTML=`<div><label>वडा नं.</label><select id="f_ward">${ws.map(w=>`<option>${w}</option>`).join('')}</select></div>`+
  [...BASE,...allKeys,...TAIL].filter(k=>k!='sn').map(k=>`<div><label>${LBL[k]}</label>${k=='remark'?`<textarea id="f_${k}" rows=2></textarea>`:`<input id="f_${k}">`}</div>`).join('')}
async function addRec(){const r={ward:+$('f_ward').value};[...BASE,...allKeys,...TAIL].forEach(k=>{if(k=='sn')return;const v=cl($('f_'+k)&&$('f_'+k).value);if(v)r[k]=v});
 if(!r.name){$('fmsg').textContent='घरधनीको नाम आवश्यक छ';return}
 r.sn=data.filter(x=>x.ward==r.ward).length+1;data.push(r);save();await push([r]);await refresh();
 document.querySelectorAll('#form input,#form textarea').forEach(i=>i.value='');$('fmsg').textContent='✔ Supabase मा सुरक्षित भयो'}
function tab(n){[1,2,3].forEach(i=>{$('v'+i).classList.toggle('hide',i!=n);$('t'+i).classList.toggle('on',i==n)})}

/* ---- filtering ---- */
function filtered(){const q=$('q').value.trim(),sel=CATS.filter(c=>C.has(c[0])),all=$('mode2').value=='all';
 return data.filter(r=>{if(W.size&&!W.has(String(r.ward))&&!W.has(r.ward))return false;
  if(sel.length){const t=c=>c[1].some(k=>has(r,k));if(all?!sel.every(t):!sel.some(t))return false}
  if(q&&!['name','user','place','phone','remark'].some(k=>(r[k]||'').includes(q)))return false;return true})}
const sum=(rs,k)=>rs.reduce((a,r)=>a+(has(r,k)?(isNaN(num(r[k]))?0:num(r[k])):0),0);
const cnt=(rs,ks)=>rs.filter(r=>ks.some(k=>has(r,k))).length;
function cols(){const sel=CATS.filter(c=>C.has(c[0]));return['ward',...BASE,...(sel.length?sel.flatMap(c=>c[1]):allKeys),...TAIL]}

function render(){const rs=filtered();
 const ward=new Set(rs.map(r=>r.ward)).size;
 $('kpis').innerHTML=[['रेकर्ड',rs.length],['वडा',ward],['प्रभावित परिवार (कुल)',sum(rs,'hh')||'-'],['मृत्यु',sum(rs,'death')],['घाइते',sum(rs,'injured')],
  ['घर पूर्ण क्षति',cnt(rs,['d_full'])],['जग्गा बगर+कटान (रोपनी)',(sum(rs,'l_bagar')+sum(rs,'l_katan')).toFixed(2)],['धान क्षति (मुरी)',sum(rs,'c_dhan')]]
  .map(k=>`<div class=kpi><b>${k[1]}</b>${k[0]}</div>`).join('');
 const bs=CATS.map(c=>[c[0],cnt(rs,c[1])]),mx=Math.max(1,...bs.map(b=>b[1]));
 $('bars').innerHTML=bs.map(b=>`<div class=bar><span>${b[0]}</span><i style="width:${b[1]/mx*60}%"></i><em>${b[1]}</em></div>`).join('');
 const ws=[...new Set(rs.map(r=>+r.ward))].sort((a,b)=>a-b);
 $('wt').innerHTML='<tr><th>वडा</th><th>रेकर्ड</th><th>घर क्षति</th><th>सिँचाइ</th><th>गोठ</th><th>मृत्यु</th><th>घाइते</th><th>जग्गा (रोपनी)</th><th>धान (मुरी)</th><th>चौपाया</th><th>पंक्षी</th><th>खाद्यान्न</th></tr>'+
  ws.map(w=>{const g=rs.filter(r=>r.ward==w);return`<tr><td>${w}</td><td>${g.length}</td><td>${cnt(g,['d_full','d_most','d_normal'])}</td><td>${cnt(g,['ip_full','ip_part','ik_full','ik_part'])}</td><td>${cnt(g,['g_full','g_norm'])}</td><td>${sum(g,'death')}</td><td>${sum(g,'injured')}</td><td>${(sum(g,'l_bagar')+sum(g,'l_katan')).toFixed(2)}</td><td>${sum(g,'c_dhan')}</td><td>${cnt(g,['cattle'])}</td><td>${cnt(g,['birds'])}</td><td>${cnt(g,['grain'])}</td></tr>`}).join('')||'<tr><td>डाटा छैन – Excel अपलोड गर्नुहोस्</td></tr>';
 const cs=cols();$("cnt2").textContent=`कुल ${rs.length} रेकर्ड`;
 $('tb').innerHTML='<tr>'+cs.map(k=>`<th>${LBL[k]}</th>`).join('')+'</tr>'+rs.map(r=>'<tr>'+cs.map(k=>`<td>${esc(r[k]??'')}</td>`).join('')+'</tr>').join('')}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---- export ---- */
function title(){return'गलकोट नगरपालिका – विपद् क्षति विवरण'+(W.size?' (वडा '+[...W].sort((a,b)=>a-b).join(', ')+')':'')+(C.size?' – '+[...C].join(', '):'')}
function tableHTML(){const cs=cols(),rs=filtered();return`<h3>${title()}</h3><table border=1 cellspacing=0 cellpadding=3 style="border-collapse:collapse;font-size:10pt"><tr>${cs.map(k=>`<th>${LBL[k]}</th>`).join('')}</tr>${rs.map(r=>'<tr>'+cs.map(k=>`<td>${esc(r[k]??'')}</td>`).join('')+'</tr>').join('')}</table>`}
function xl(){const cs=cols(),rs=filtered(),ws=XLSX.utils.aoa_to_sheet([cs.map(k=>LBL[k]),...rs.map(r=>cs.map(k=>r[k]??''))]);
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'क्षति विवरण');XLSX.writeFile(wb,'galkot_kshati.xlsx')}
function doc(){const h=`<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>@page{size:landscape}</style></head><body>${tableHTML()}</body></html>`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',h],{type:'application/msword'}));a.download='galkot_kshati.doc';a.click()}
function pdf(){const w=window.open('','_blank');w.document.write(`<html><head><meta charset="utf-8"><title>${title()}</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:"Noto Sans Devanagari",Mangal,Arial}td,th{font-size:8pt;vertical-align:top}</style></head><body>${tableHTML()}</body></html>`);w.document.close();setTimeout(()=>w.print(),400)}

if(sessionStorage.a=='sb'&&sb)pull().then(r=>{if(r===true)start();else{sessionStorage.removeItem('a');$('lerr').textContent='Supabase जडान असफल: '+r}})
</script></body></html>
