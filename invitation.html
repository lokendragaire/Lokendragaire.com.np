<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>निमन्त्रणा पत्र जेनेरेटर</title>
    <!-- html2canvas लाइब्रेरी -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        /* कार्डको मुख्य कन्टेनर (यसलाई मात्र डाउनलोड गरिन्छ) */
        #card-container {
            position: relative;
            width: 800px; 
            max-width: 100%;
            background-image: url('invitation.jpg'); /* तपाईंको फोटोको नाम */
            background-size: 100% 100%; /* फोटोलाई पूरै फिट गर्न */
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background-color: #fff; 
        }

        /* फोटोको अनुपात कायम राख्न एउटा अदृश्य फोटो राखिएको */
        #card-container img {
            width: 100%;
            display: block;
            visibility: hidden; 
        }

        /* नाम राख्ने ठाउँ (श्री पछाडी) */
        #name-display {
            position: absolute;
            top: 34.5%; /* नाम माथि "श्री" भएको ठाउँमा */
            left: 8%;
            width: 70%;
            font-size: 22px;
            font-weight: bold;
            color: #c00000; /* रातो रंग */
            font-family: 'Arial', sans-serif;
            pointer-events: none; 
            white-space: nowrap; 
        }
        
        /* ठेगाना राख्ने ठाउँ (नामको ठीक तल) */
        #address-display {
            position: absolute;
            top: 38%; /* नामको तल, मुख्य बुँदा सुरु हुनु अगाडि */
            left: 8%; /* नामसँगै मिलाउन */
            width: 70%;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            font-family: 'Arial', sans-serif;
            pointer-events: none;
            white-space: nowrap;
        }

        /* कन्ट्रोल प्यानल */
        .controls {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        .controls label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #444;
        }

        .controls input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .controls input[type="text"]:focus {
            border-color: #25D366;
            outline: none;
        }

        .controls button {
            background-color: #25D366; 
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }

        .controls button:hover {
            background-color: #128C7E;
        }

        /* मोबाइलको लागि */
        @media (max-width: 600px) {
            #name-display { font-size: 16px; top: 34.5%; left: 8%; }
            #address-display { font-size: 13px; top: 37.5%; left: 8%; }
            .controls { padding: 15px; }
        }
    </style>
</head>
<body>

    <h2>निमन्त्रणा पत्रमा नाम र ठेगाना राख्नुहोस्</h2>

    <!-- यो भाग मात्र डाउनलोड हुन्छ -->
    <div id="card-container">
        <!-- अदृश्य फोटो (उचाइ मिलाउन) -->
        <img src="invitation.jpg" alt="Invitation Background" onerror="this.style.display='none'; document.getElementById('card-container').style.height='1130px';">
        
        <!-- नाम देखाउने ठाउँ -->
        <div id="name-display"></div>
        
        <!-- ठेगाना देखाउने ठाउँ -->
        <div id="address-display"></div>
    </div>

    <!-- इनपुट बक्सहरू -->
    <div class="controls">
        <label>नाम (श्री पछाडी):</label>
        <input type="text" id="input-name" placeholder="उदा: राम बहादुर श्रेष्ठ" oninput="updateText()">
        
        <label>ठेगाना (नामको तल):</label>
        <input type="text" id="input-address" placeholder="उदा: काठमाडौं" value="" oninput="updateText()">

        <button onclick="downloadImage()">फोटो डाउनलोड गर्नुहोस् (Download)</button>
    </div>

    <script>
        // सुरुमा लोड हुँदा टेक्स्ट अपडेट गर्न
        window.onload = function() {
            updateText();
        };

        // इनपुट फिल्डको डाटा कार्डमा ट्रान्सफर गर्ने फंक्शन
        function updateText() {
            let nameVal = document.getElementById('input-name').value;
            let addressVal = document.getElementById('input-address').value;
            
            // यदि नाम खाली छ भने डट (....) देखाउने
            if(nameVal.trim() === "") {
                document.getElementById('name-display').innerText = "..............................";
            } else {
                document.getElementById('name-display').innerText = nameVal;
            }
            
            // ठेगाना खाली भए केही नदेखाउने
            if(addressVal.trim() !== ""){
                document.getElementById('address-display').innerText = addressVal;
            } else {
                document.getElementById('address-display').innerText = "";
            }
        }

        // कार्डलाई फोटोको रूपमा डाउनलोड गर्ने फंक्शन
        function downloadImage() {
            const card = document.getElementById('card-container');
            
            html2canvas(card, {
                scale: 2, // फोटोको क्वालिटी (HD)
                useCORS: true, 
                backgroundColor: null,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Nimantran_Patra.png';
                link.href = canvas.toDataURL('image/png');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }).catch(err => {
                alert("फोटो डाउनलोड गर्न समस्या भयो। कृपया फेरि प्रयास गर्नुहोस्।");
                console.error(err);
            });
        }
    </script>
</body>
</html>
